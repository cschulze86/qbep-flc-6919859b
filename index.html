  var items = DATA.scoring[subject], out = [], field, spec, v;
  for (field in items) {
    spec = items[field];
    v = state.marks[field];
    if (v === undefined) break;
    v = parseInt(v, 10);
    if (spec.correct.indexOf(v) < 0) break;
    if (v !== PERFECT[spec.list]) out.push(field);
  }
  return out;
}

/* ---------------- scoring (identical to validated pipeline logic) ------- */
function scoreSubject(subject) {
  var items = DATA.scoring[subject];
  var running = 0, failed = null, field, spec, v;
  for (field in items) {
    spec = items[field];
    v = state.marks[field];
    if (v === undefined) { failed = failed || field; break; }
    if (spec.correct.indexOf(parseInt(v, 10)) >= 0) {
      running = spec.grade;
    } else { failed = field; break; }
  }
  return { grade: running, failed: failed };
}

/* ---------------- rendering -------------------------------------------- */
function header() {
  return '<div class="band"><button class="toggle" onclick="toggleLang()">' +
    (uiLang === "en" ? "မြန်မာ" : "English") + "</button>" +
    "<h1>" + T("title") + '</h1><div class="sub">' + T("subtitle") +
    "</div></div>";
}
function toggleLang() { uiLang = (uiLang === "en" ? "my" : "en"); rerender(); }
var lastRender = null;
function rerender() { if (lastRender) lastRender(); }

function showSetup() {
  lastRender = showSetup;
  var langs = DATA.languages, opts = "", i;
  var names = { english: "English", burmese: "မြန်မာ (Myanmar)",
    hakha: "Laitu (Hakha Chin)", shan: "Tai Long (Shan)",
    jingpaw: "Jingpo (ဂျိန်းဖော)" };
  for (i = 0; i < langs.length; i++) {
    opts += '<option value="' + langs[i] + '"' +
      (langs[i] === "burmese" ? " selected" : "") + ">" +
      (names[langs[i]] || langs[i]) + "</option>";
  }
  app().innerHTML = header() +
    '<div class="card"><h2>' + T("setupTitle") + "</h2>" +
    "<label>" + T("langLabel") + '<select id="lang">' + opts + "</select></label>" +
    '<div class="langrow"><label class="chk"><input type="checkbox" id="doLit" checked> ' +
    T("litLabel") + '</label><label class="chk"><input type="checkbox" id="doNum" checked> ' +
    T("numLabel") + '</label><label class="chk"><input type="checkbox" id="doWb"> ' +
    T("wbLabel") + "</label></div>" +
    '<button class="btn" onclick="startAssessment()">' + T("start") + "</button></div>" +
    '<div class="instr">' + T("privacyNote") + "</div>" +
    '<div class="footer">' + T("draftFooter") + "</div>";
}

function startAssessment() {
  var lit = document.getElementById("doLit").checked;
  var num = document.getElementById("doNum").checked;
  var wb = document.getElementById("doWb").checked;
  if (!lit && !num && !wb) return;
  state = {
    lang: document.getElementById("lang").value,
    seedA: randInt(5), seedB: randInt(4),
    marks: {}, wb: {}, wbOn: wb,
    extra: {}, extraOn: num, extraIdx: 0,
    samples: {},
    plan: [], rung: 0, step: 0, trail: []
  };
  if (lit) state.plan = state.plan.concat(litPlan());
  if (num) state.plan = state.plan.concat(numPlan());
  state.stopped = {};
  showStep();
}

function currentRung() { return state.plan[state.rung]; }

function gridFor(step) {
  var id = step.key;
  if (!state.samples[id]) {
    state.samples[id] = sample(bankFor(step.key), step.n);
  }
  return state.samples[id];
}

function subjectOf(field) {
  return DATA.scoring.literacy[field] ? "literacy" : "numeracy";
}

function showStep() {
  lastRender = showStep;
  if (!state) return showSetup();
  if (state.rung >= state.plan.length) {
    if (state.extraOn) return showExtra(0);
    return state.wbOn ? showWb(0) : showResults();
  }
  var rung = currentRung();
  var subj = subjectOf(rung.f);
  if (state.stopped[subj]) { state.rung++; state.step = 0; return showStep(); }
  var step = rung.steps[state.step];
  var html = header() + '<div class="progress">' +
    T(subj === "literacy" ? "litLabel" : "numLabel") + " · " +
    (state.rung + 1) + "/" + state.plan.length + "</div>";
  var backBtn = (state.trail.length ?
    '<button class="back" onclick="goBack()">&#8592; ' + T("back") + "</button>" : "");

  if (step.t === "grid" || step.t === "text" || step.t === "twoQ") {
    var ins = step.ins ? instr(step.ins[0], step.ins[1]) :
      (step.insTxt ? T(step.insTxt) : "");
    var insHtml = "";
    if (step.preQ) {
      /* form protocol: announce the question(s) to the child BEFORE they
         read (sentence/text comprehension intro notes) */
      var qs = "", p;
      for (p = 0; p < step.preQ.length; p++) {
        qs += "<br><b>" + esc(stimText(step.preQ[p])) + "</b>";
      }
      insHtml = '<div class="instr">' + esc(T("readToAnswerIns")) + qs +
        "<br><br>" + esc(T("afterReadIns")) + "</div>";
    } else if (ins) {
      insHtml = '<div class="instr">' + esc(ins) + "</div>";
    }
    var body = "";
    if (step.t === "grid") {
      body = '<div class="stim grid">' + esc(gridFor(step).join(" ")) + "</div>";
    } else if (step.t === "twoQ") {
      body = '<div class="stim small">1) ' + esc(stimText(step.keys[0])) +
        "<br><br>2) " + esc(stimText(step.keys[1])) + "</div>";
    } else {
      var s = stimText(step.key);
      if (s == null) { markValue(null); return; }
      body = '<div class="stim' + (step.big ? "" : " small") + '">' +
        esc(s) + "</div>";
    }
    html += backBtn + insHtml +
      '<div class="card">' + body + "</div>" +
      '<button class="btn" onclick="nextStep()">' + T("continueBtn") + "</button>";
  } else if (step.t === "mark") {
    var mIns = step.insTxt ? T(step.insTxt) : "";
    var mInsHtml = mIns ? '<div class="instr">' + esc(mIns) + "</div>" : "";
    var askHtml = "", facil = "";
    if (step.q) {
      /* the question (and options) are read to / seen by the child; only
         the correct answer is facilitator-only */
      var q = stimText(step.q), a = stimText(step.a);
      var o = step.opts ? stimText(step.opts) : null;
      askHtml = '<div class="card"><div class="stim small"><b>' + esc(q) +
        "</b>" + (o ? "<br><br>" + esc(o) : "") + "</div></div>";
      if (a) {
        facil = '<div class="facil"><span class="tag">' + T("facilOnly") +
          "</span><div><b>" + T("answerLbl") + "</b> " + esc(a) +
          "</div></div>";
      }
    }
    if (step.ansKey) {
      facil = '<div class="facil"><span class="tag">' + T("facilOnly") +
        "</span><div><b>" + T("answerLbl") + "</b> " +
        esc(stimText(step.ansKey)) + "</div></div>";
    }
    if (step.ansKeys) {
      facil = '<div class="facil"><span class="tag">' + T("facilOnly") +
        "</span><div><b>" + T("answerLbl") + "</b><br>1) " +
        esc(stimText(step.ansKeys[0])) + "<br>2) " +
        esc(stimText(step.ansKeys[1])) + "</div></div>";
    }
    /* marking options are deliberately NOT visually cued for pass/fail:
       the facilitator must mark what happened, not steer the score */
    var choices = DATA.choices[step.list], btns = "", i, c;
    for (i = 0; i < choices.length; i++) {
      c = choices[i];
      btns += '<button class="opt" onclick="markValue(\'' +
        c.value + '\')">' + esc(choiceLabel(c)) + "</button>";
    }
    html += backBtn + mInsHtml + askHtml + facil +
      '<div class="card"><h2>' + T("markTitle") + "</h2>" + btns + "</div>";
  }
  html += '<div class="footer">' + T("draftFooter") + "</div>";
  app().innerHTML = html;
  window.scrollTo(0, 0);
}

function nextStep() {
  state.trail.push({ rung: state.rung, step: state.step });
  state.step++;
  if (state.step >= currentRung().steps.length) { state.rung++; state.step = 0; }
  showStep();
}
function goBack() {
  var prev = state.trail.pop();
  if (!prev) return;
  var rung = state.plan[prev.rung];
  delete state.marks[rung.f];
  var subj = subjectOf(rung.f);
  delete state.stopped[subj];
  state.rung = prev.rung; state.step = prev.step;
  showStep();
}
function markValue(v) {
  var rung = currentRung();
  var subj = subjectOf(rung.f);
  state.trail.push({ rung: state.rung, step: state.step });
  if (v !== null) state.marks[rung.f] = v;
  var spec = DATA.scoring[subj][rung.f];
  var pass = v !== null && spec.correct.indexOf(parseInt(v, 10)) >= 0;
  if (!pass) state.stopped[subj] = true;
  state.rung++; state.step = 0;
  showStep();
}

/* ---------------- practical maths skills (form elana_test block) --------
   Administered after the numeracy ladder for every child (not gated, not
   part of the grade score). Pass/fail per skill, reported separately. */
var EXTRA_FLOW = [
  { f: "geometry", list: "shape_answer", ins: "geometry" },
  { f: "measurement", list: "measure_answer", ins: "measurement",
    ansKey: "measure_ans" },
  { f: "pattern_recognition", list: "pat_answer", ins: "pattern_recognition",
    ansKey: "pat_ans" },
  { f: "data_tally", list: "tally_answer", ins: "data_tally",
    ansKey: "data_ans1" },
  { f: "data_graph", list: "correct", ins: "data_graph" }
];
function extraImg(skill) {
  if (skill.f === "geometry") return IMGS.geometry;
  if (skill.f === "pattern_recognition") return IMGS.pattern;
  if (skill.f === "measurement") return IMGS["measure_" + state.seedA];
  if (skill.f === "data_tally")
    return IMGS["data_1" + "abcde".charAt(state.seedA - 1)];
  return IMGS[state.lang === "burmese" ? "data_2_bur"
    : (state.lang === "jingpaw" ? "data_2_jpw" : "data_2_en")];
}
function showExtra(i) {
  lastRender = function () { showExtra(i); };
  state.extraIdx = i;
  var skillIdx = i >> 1, phase = i & 1;
  if (skillIdx >= EXTRA_FLOW.length)
    return state.wbOn ? showWb(0) : showResults();
  var skill = EXTRA_FLOW[skillIdx];
  var html = header() + '<div class="progress">' + T("extraTitle") + " · " +
    (skillIdx + 1) + "/" + EXTRA_FLOW.length + "</div>";
  if (i > 0) {
    html += '<button class="back" onclick="showExtra(' + (i - 1) +
      ')">&#8592; ' + T("back") + "</button>";
  }
  if (phase === 0) {
    var ins = instr(skill.ins, 0);
    html += (ins ? '<div class="instr">' + esc(ins) + "</div>" : "") +
      '<div class="card"><div class="stim"><img src="' + extraImg(skill) +
      '" alt=""></div></div>' +
      '<button class="btn" onclick="extraNext()">' + T("continueBtn") +
      "</button>";
  } else {
    var facil = "";
    if (skill.ansKey) {
      facil = '<div class="facil"><span class="tag">' + T("facilOnly") +
        "</span><div><b>" + T("answerLbl") + "</b> " +
        esc(stimText(skill.ansKey)) + "</div></div>";
    }
    var choices = DATA.choices[skill.list], btns = "", j, c;
    for (j = 0; j < choices.length; j++) {
      c = choices[j];
      btns += '<button class="opt" onclick="extraMark(\'' + c.value +
        '\')">' + esc(choiceLabel(c)) + "</button>";
    }
    html += facil + '<div class="card"><h2>' + T("markTitle") + "</h2>" +
      btns + "</div>";
  }
  html += '<div class="footer">' + T("draftFooter") + "</div>";
  app().innerHTML = html;
  window.scrollTo(0, 0);
}
function extraNext() { showExtra(state.extraIdx + 1); }
function extraMark(v) {
  state.extra[EXTRA_FLOW[state.extraIdx >> 1].f] = v;
  showExtra(state.extraIdx + 1);
}

/* ---------------- wellbeing module -------------------------------------- */
/* Wellbeing questions and feelings options are CHILD-facing: primary text
   follows the assessment language (the facilitator reads it to the child).
   When the interface language differs, a small gloss line in the other
   language keeps the facilitator oriented. The form carries EN + MY only
   for this section, so non-Burmese assessment languages read English. */
function wbDual(lab) {
  var prim = (state.lang === "burmese" && lab.my) ? lab.my : (lab.en || "");
  var gloss = "";
  if (state.lang === "burmese" && uiLang === "en" && lab.en) gloss = lab.en;
  else if (state.lang !== "burmese" && uiLang === "my" && lab.my) gloss = lab.my;
  return { prim: prim, gloss: gloss };
}
function showWb(idx) {
  lastRender = function () { showWb(idx); };
  var shortF = DATA.wellbeing.short_form, feels = DATA.wellbeing.feels;
  var all = shortF.concat(feels);
  if (idx >= all.length) return showResults();
  var name = all[idx], lab = DATA.wellbeing.labels[name] || {};
  var d = wbDual(lab);
  var qText = d.prim || name;
  var isFace = idx < shortF.length;
  var html = header() + '<div class="progress">' + T("wbLabel") + " · " +
    (idx + 1) + "/" + all.length + "</div>";
  if (idx > 0) {
    html += '<button class="back" onclick="showWb(' + (idx - 1) +
      ')">&#8592; ' + T("back") + "</button>";
  }
  if (idx === 0) html += '<div class="instr">' + T("wbIntro") + "</div>";
  html += '<div class="card"><div class="stim small">' + esc(qText) + "</div>" +
    (d.gloss ? '<div class="gloss">' + esc(d.gloss) + "</div>" : "");
  if (isFace) {
    var f = "", i;
    for (i = 0; i < 5; i++) {
      f += '<img src="' + FACES[i] + '" alt="' + i +
        '" onclick="wbAnswer(\'' + name + "'," + i + "," + idx + ')">';
    }
    html += '<div class="faces">' + f + "</div>";
  } else {
    var choices = DATA.choices.feels, btns = "", j, c, cd;
    for (j = 0; j < choices.length; j++) {
      c = choices[j];
      if (c.value === "88" || c.value === "99") continue;
      cd = wbDual(c);
      btns += '<button class="opt" onclick="wbAnswer(\'' + name + "'," +
        c.value + "," + idx + ')">' + esc(cd.prim || c.value) +
        (cd.gloss ? '<br><span class="gloss">' + esc(cd.gloss) + "</span>" : "") +
        "</button>";
    }
    html += btns;
  }
  html += '<button class="btn grey" onclick="wbAnswer(\'' + name +
    "',null," + idx + ')">' + T("skip") + "</button></div>" +
    '<div class="footer">' + T("draftFooter") + "</div>";
  app().innerHTML = html;
  window.scrollTo(0, 0);
}
function wbAnswer(name, v, idx) {
  if (v !== null) state.wb[name] = v;
  showWb(idx + 1);
}

/* ---------------- results ----------------------------------------------- */
function gradeLabel(g) {
  if (g === 0) return T("level0");
  return T("gradePrefix") + " " + g;
}
function skillCard(subject) {
  var r = scoreSubject(subject);
  var any = false, f;
  for (f in DATA.scoring[subject]) { if (state.marks[f] !== undefined) any = true; }
  if (!any) return "";
  var html = '<div class="card"><h2>' +
    T(subject === "literacy" ? "litLabel" : "numLabel") + "</h2>" +
    '<div class="result-big">' + gradeLabel(r.grade) + "</div>";
  if (r.failed) {
    var tip = TIPS[r.failed] || {};
    var skillName = pick(tip.skill) || r.failed;
    var tipTxt = pick(tip.tip);
    var link = OLM_LINKS[r.failed];
    html += '<div class="skill"><b>' + T("practiseNext") + "</b> " +
      esc(skillName) +
      (tipTxt ? "<br><br>" + esc(tipTxt) : "") + "</div>" +
      (link ? '<a class="olm" href="' + link + '">' + T("olmLink") + "</a>"
            : '<span class="olm">' + T("olmPlaceholder") + "</span>");
  } else {
    html += '<div class="skill">' + T("topOfLadder") + "</div>";
  }
  var rev = reviewList(subject), seen = {}, rows = "", j, tip2, name2, l2;
  for (j = 0; j < rev.length; j++) {
    tip2 = TIPS[rev[j]] || {};
    name2 = pick(tip2.skill) || rev[j];
    if (seen[name2]) continue;
    seen[name2] = 1;
    l2 = OLM_LINKS[rev[j]];
    rows += '<div class="xrow">' + esc(name2) +
      (l2 ? ' <a class="olm" href="' + l2 + '">' + T("olmLink") + "</a>"
          : ' <span class="olm">' + T("olmPlaceholder") + "</span>") +
      "</div>";
  }
  if (rows) {
    html += '<div class="skill" style="background:#fef8ec"><b>' +
      T("reviseTitle") + "</b>" + rows +
      '<div class="xtip">' + T("reviseNote") + "</div></div>";
  }
  html += "</div>";
  return html;
}
function extraCard() {
  var any = false, k;
  for (k in state.extra) any = true;
  if (!any) return "";
  var rows = "", i, skill, v, pass, tip, name;
  for (i = 0; i < EXTRA_FLOW.length; i++) {
    skill = EXTRA_FLOW[i];
    v = state.extra[skill.f];
    if (v === undefined) continue;
    pass = DATA.extra_scoring[skill.f].correct.indexOf(parseInt(v, 10)) >= 0;
    tip = TIPS[skill.f] || {};
    name = pick(tip.skill) || skill.f;
    rows += '<div class="xrow"><span class="' + (pass ? "ok" : "no") + '">' +
      (pass ? "&#10003;" : "&#9675;") + "</span> " + esc(name) +
      (!pass && pick(tip.tip) ?
        '<div class="xtip">' + esc(pick(tip.tip)) + "</div>" : "") + "</div>";
  }
  return '<div class="card"><h2>' + T("extraTitle") + "</h2>" + rows +
    '<div class="wb-note">' + T("extraNote") + "</div></div>";
}
function showResults() {
  lastRender = showResults;
  var html = header() + '<div class="card"><h2>' + T("resultsTitle") + "</h2></div>";
  html += skillCard("literacy") + skillCard("numeracy") + extraCard();
  /* wellbeing summary */
  var shortF = DATA.wellbeing.short_form, n = 0, sum = 0, i, v;
  for (i = 0; i < shortF.length; i++) {
    v = state.wb[shortF[i]];
    if (v !== undefined) { n++; sum += v; }
  }
  if (n > 0) {
    var pomp = Math.round((sum / (n * 4)) * 100);
    html += '<div class="card"><h2>' + T("wbLabel") + "</h2>" +
      '<div class="wb-note">' +
      (pomp < 75 ? T("wbLow") : T("wbOk")) + "</div></div>";
  }
  html += '<button class="btn" onclick="restart()">' + T("newAssessment") +
    "</button>" + '<div class="footer">' + T("draftFooter") + "</div>";
  app().innerHTML = html;
  window.scrollTo(0, 0);
}
function restart() { state = null; showSetup(); }

showSetup();
</script>
<style>
#instBar { position: fixed; left: 0; right: 0; bottom: 0; background: #0b6c96;
  color: #fff; padding: 12px 14px; display: none; z-index: 99;
  box-shadow: 0 -2px 8px rgba(0,0,0,.25); }
#instBar .t { font-size: 14px; line-height: 1.4; margin-bottom: 8px; }
#instBar button { background: #fff; color: #0b6c96; font-weight: bold;
  font-size: 16px; padding: 10px; border-radius: 8px; width: 100%; }
#instBar .x { position: absolute; top: 4px; right: 10px; background: none;
  color: #fff; width: auto; font-size: 20px; padding: 2px 6px; }
</style>
<div id="instBar">
<button class="x" onclick="document.getElementById('instBar').style.display='none'">&times;</button>
<div class="t" id="instTxt"></div>
<button id="instBtn" style="display:none">Install ထည့်သွင်းရန်</button>
</div>
<script>
if ("serviceWorker" in navigator &&
    (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js");
}
(function () {
  var standalone = window.matchMedia &&
    window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true;
  if (standalone) return;
  var bar = document.getElementById("instBar");
  var txt = document.getElementById("instTxt");
  var btn = document.getElementById("instBtn");
  var deferred = null;
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferred = e;
    txt.innerHTML = "Install this tool as an app - it will work offline. ဤကိရိယာကို အက်ပ်အဖြစ် ထည့်သွင်းနိုင်ပြီး အင်တာနက်မလိုဘဲ အသုံးပြုနိုင်ပါမည်။";
    btn.style.display = "block";
    bar.style.display = "block";
  });
  btn.onclick = function () {
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function () {
      bar.style.display = "none"; deferred = null;
    });
  };
  window.addEventListener("appinstalled", function () {
    bar.style.display = "none";
  });
  var ua = navigator.userAgent;
  if (/iPhone|iPad|iPod/.test(ua) && !window.MSStream) {
    txt.innerHTML = "To install: tap the Share button, then Add to Home Screen. ထည့်သွင်းရန် - Share ခလုတ်ကို နှိပ်ပြီး Add to Home Screen ကို ရွေးပါ။";
    bar.style.display = "block";
  }
})();
</script></body>
