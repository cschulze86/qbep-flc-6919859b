,"Thiri is a joyful girl,\nShe likes to move.\nThiri laughs and sings,\nShe spreads smiles.","Aung Aung is a cheerful boy,\nHe is  never ever sad.\nAung Aung jumps and runs,\nHe enjoys the  sun."],"text_2":["Marlar lives with her mother and father in a little village. Her brother Thaung lives in a big city where he goes to school. Marlar was happy when Thaung came home. They played games and their mother made lots of food. Thaung had to go back to school, Marlar told him to come back soon.","Htet  lives with her grandparents in a small town. Her cousin Kyaw  stays in a large city for his college studies. Htet  felt excited when Kyaw  visited. They spent time together, playing games and enjoying delicious meals prepared by their grandparents. As Kyaw  departed for college, Htet said goodbye","Sawyer lives with his parents in a small town. His sister Mia resides in a large city for college. Sawyer was happy when Mia returned home for a visit. They spent time together, playing games and enjoying delicious meals cooked by their mother. When Mia had to return to college, Sawyer said, \"Come back soon!\"","Thida lives with her aunt and uncle in a small village. Her cousin Htet lives in a large city for university studies. Thida was excited when Htet returned home for a visit. They spent time together, playing games and enjoying  homemade food prepared by their aunt. When Htet had to leave for university again, Thida hugged and said, \"Come back soon!\"","Min Min lives with her parents in a rural village. Her brother Kyaw lives in a busy city for work. Min Min was happy  when Kyaw returned home for a visit. They spent time together, playing games and sharing stories over delicious  meals prepared by their parents. When Kyaw had to leave for work again, Min Min hugged him tightly and said, \"Come back soon!\""],"sentence_1":["Nandar is going to the zoo because he likes animals very much.","Hla Hla is going to the library because she loves to read books.","Sai is going to th y with the installation of a new water pump. This development promises to provide clean and reliable water, reducing the burden on villagers who previously had to travel long distances to fetch water.\n\nKo Aung Myo, a local school teacher, mentioned that this new pump reduces the number of sick days among students as they now have access to clean water. The installation of two new pumps was part of a broader initiative funded by international aid organizations.","New Health Clinic Opens in Kyun Taw Village\n\nThe opening of a new health clinic in Kyun Taw Village marks a significant step forward in the community's healthcare services. The clinic is equipped to provide vaccinations, maternal and child health services, and general medical care to the villagers.\n\nThis clinic was funded by UNICEF and the local community, highlighting a successful collaboration aimed at improving health outcomes. Residents are hopeful that the clinic will address the medical needs of the village and reduce the incidence of preventable diseases.","Hmawbi Village Welcomes New School\n\nHmawbi Village celebrated the opening of a new school last week. This educational facility, which contains five classrooms, aims to provide quality education to the children of the village and surrounding areas.\n\nKo Min Zaw, a parent in the village, expressed his gratitude, noting that the school will serve his two children and many others in the community. The school’s construction was funded by a combination of government funds and community efforts, demonstrating a commitment to the future of the village’s children."],"tc_q3":["Name one event the city plans on hosting in the new library.","What now makes it easier and safer for villagers to navigate at night?","What did Ko Aung Myo, a local school teacher, say about the new water pump?","Name one service the new health clinic in Kyun Taw Village offers.","How many classrooms does the new school have?"],"tc_a3":["Possible Answers: \n- Book fairs\n- Re lete the sentence:"],"g5I2_answer":["plays","goes","barks","eat"],"g6I1_passage":["Fatima studied hard every night for her exams. She woke up early to revise, made detailed notes, and always asked her teacher for help when she did not understand something. Even when she was tired, she kept going because she wanted to do well. On the day of the exam, she felt confident because she had prepared thoroughly.","Alex spent his weekends building a treehouse. He watched videos, read instructions, and asked for advice. Even when he made mistakes, he didn’t give up. After many weekends, the treehouse was complete.","Tara helped her classmates understand math problems. She explained patiently and made sure everyone was included. Her classmates appreciated her help and looked up to her.","Sophie was nervous about performing in the school talent show. She had practiced for weeks, but when it was her turn, her hands were trembling. As the music started, she took a deep breath and focused. As she played, the nervousness faded, and by the end of her performance, she felt proud of herself for facing her fear."],"g6I1_question":["How does Fatima respond to the challenges she faces, and how does this contribute to the story's resolution?","How does Alex respond to the challenges in building the treehouse, and what is the outcome?","How does Tara respond to the situation with her classmates, and how does this contribute to the story’s resolution?","How does Sophie respond to her nervousness, and what is the outcome of her performance?"],"g6I1_options":["Fatima avoids studying, and the result is that she fails the exam.\nFatima gives up when things get difficult and does not improve.\nFatima works hard, asking for help when needed, and feels confident on the day of the exam.\nFatima studies without taking breaks and burns out by the exam day.","Alex builds the treehouse without help and makes many mistakes that ruin the project.\nAlex starts the treehouse but stops when he realizes it’s ုင်သည်။ သူ့အစ်မ မီရာသည် ကောလိပ်တက်ရန်အတွက် မြို့ကြီးတစ်မြို့တွင် နေထိုင်သည်။ မီရာ အိမ်သို့ အလည်အပတ်ပြန်လျှင် စောရာ ပျော်သည်။ သူတို့ အတူတူ ဂိမ်းဆော့ရင်း အမေချက်ပြုတ်ထားသော အရသာရှိသည့် အစားအစာများကို  အတူတကွနှစ်သက်စွာ စားသောက်ကြသည်။ မီရာ ကောလိပ်တက်ရန် ပြန်သောအခါ စောရာက အမြန်ပြန်လာဖို့ပြောသည်။","သီတာသည်  ဦးလေးအဒေါ် တို့နှင့်အတူ ရွာငယ်လေးတွင် နေထိုင်သည်။ ဝမ်းကွဲညီအစ်မ ထက်သည် တက္ကသိုလ်တက်ရန် မြို့ကြီးတစ်မြို့၌ နေထိုင်သည်။ ထက် အိမ်သို့ အလည်ပြန်လာလျှင် သီတာပျော်သည်။ သူတို့နှစ်ယောက်အတူတူ  ဂိမ်းဆော့ရင်း အဒေါ်ပြင်ဆင်ပေးသည့် အစားအစာများကို နှစ်သက်စွာစားသောက်ကြသည်။ ထက် တက္ကသိုလ်တက်ရန် ပြန်သွား‌သောအခါ သီတာက ပွေ့ဖက်ပြီး အမြန်ပြန်လာပါဟုပြောသည်။","မင်းမင်းသည် ကျေးလက်ရွာလေးတစ်ရွာတွင် မိဘများနှင့်အတူ နေထိုင်သည်။ သူမ၏အစ်ကို ကျော်ကမူ အလုပ်ကိစ္စဖြင့် လူစည်ကားသောမြို့ကြီးတွင် နေထိုင်သည်။ ကျော် အိမ်ပြန်လာသည့်အခါ မင်းမင်း ပျော်ရွှင်ခဲ့သည်။ သူတို့သည် မိဘများ ချက်ပြုတ်ပေးထားသည့် အရသာရှိသော အစားအစာများကို အတူတူစားခြင်း၊ ဂိမ်းများဆော့ခြင်းနှင့် ပုံပြင်များ ပြောပြခြင်းဖြင့် အချိန်ကုန်ဆုံးခဲ့ကြသည်။ ကျော် အလုပ်ပြန်သွားရတော့မည့်အခါ မင်းမင်းက သူ့ကို တင်းကျပ်စွာ ပွေ့ဖက်ပြီး အမြန်ပြန်လာပါဟု ပြောလိုက်သည်။"],"sentence_1":["နန္ဒာသည် တိရိစ္ဆာန်များကို အရမ်းချစ်သောကြောင့် တိရိစ္ဆာန်ရုံသို့သွားသည်။","လှလှသည် စာဖတ်ခြင်းကို ဝါသနာပါ သောကြောင့် စာကြည်တိုက်သို့သွားသည်။","စိုင်းသည် အပြင်မှာ ဆော့ရသည်ကို ကြိုက်နှစ်သက်သောကြောင့်ပန်းခြံသို့သွားသည် ။","မောင်သည် ရေကူးခြင်းကို ဝါသနာပါသောကြောင့် မြစ်ကမ်းသို့သွားသည်။","ကျော်သည် သစ်သီးများဝယ်ယူလိုသောကြောင့် ဈေးသို့သွားသည် ။"],"question_1":["နန္ဒာဘယ်ကိုသွားသလဲ။","လှလှဘယ်ကိုသွားသလဲ။","စိုင်းဘယ်ကိုသွားသလဲ။","မောင်ဘယ်ကိုသွားသလဲ။","ကျော်ဘယ်ကိုသွားသလဲ။"],"answer_1":["တိရိစ္ဆာန်ရုံသို့","စာကြည့်တိုက်သို့","ပန်းခြံသို့","မြစ်ကမ်းသို့","စျေးသို့"],"sentence_2":["နိုင်သည်သူငယ်ချင်းများနှင့် ပန်းခြံထဲတွင်ကစားနေသည်။","ခင်ခင်သည် နေမကောင်းသဖြင့် ဆေးရုံသို့သွားသည်။","လှလှသည် စာဖတ်ခြင်းကို ဝါသနာပါသောကြောင့် စာကြည့်တိုက်သို့သွားသည်။","အောင်အောင်သည် အနုပညာကို ဝါသနာပါသောကြောင့် ပြတိုက်သို့သွားသည်။","သန့်သည် ဘုရားသို့ သွားပြီး ဘုရားဖူးရသည်ကိုနှစ်သက်သည်။"],"question_2":["နိုင် ဘယ်မှာ ကစားနေသလဲ။","ခင်ခင်ဘယ်ကိုသွားသလဲ။","လှလှဘယ်ကိုသွားသလဲ။","အောင်အောင်ဘယ်ကိုသွားသလဲ။","သန့်ဘယ်ကိုသွားသလဲ။"],"answer_2":["ပန်းခြံထဲမှာ","ဆေးရုံသို့","စာကြည့်တိုက်သို့","ပြတိုက်သို့","ဘုရားသို့"],"tc_text_1":["ချမ်ပို သည် ဆိုင်သို့ လမ်းလျှောက်သွားနေသနေ။ သူ့အမေသည် သူ့အား ပေါင်မုန့်သွားဝယ်ခိုင်းသည်။ ချမ်ပို သည် သူ့အမေကို ကူညီရခွင့် ရသောကြောင့် အရမ်းပျော်သည်။ ချမ်ပို သည် လမ်းမပေါ်ရှိ မြောင်းပေါက်ကို မမြင်လိုက်ဘဲ ခြေထိုးမိကာ ချော်လဲသွားသည်။ အား! ချန်ပီခြေထောက်သည် အလွန်နာကျင်သွားသည်။","မေသည် စာအုပ်ဆိုင်သို့ လမ်းလျှောက်သွားသည်။ သူမ၏ ဆရာမက သူမကို စာအုပ်အသစ်တစ်အုပ် ဝယ်ခိုင်းလိုက်သည်။ မေသည် သူမ၏ ဆရာမကို ကူညီရသည်မှာ ပျော်သည်။ သို့သော် သူမသည် လမ်းမညီညာခြင်းကို သတိမထားမိဘဲ ခလုတ်တိုက်မိသည်။ အား! မေ၏ ခြေထောက်သည် အလွန်နာကျင်နေသည်။","ထက်ထက်သည် ပန်းခြံသို့ လမ်းလျှောက်နေသည်။ သူမ၏ညီမက သူမအား ဘောလုံးယူခိုင်းတယ်။ ထက်ထက်သည် သူမ၏ညီမကို ကူညီရန် စိတ်အားထက်သန်နေသည်။ သို့သော်လည်း သူမသည် မြေပြင်ပေါ်တွင်ပြုတ်ကျနေသော သစ်ကိုင်းကို သတိမထားမိဘဲ ခလုတ်တိုက်မိသွားသည်။ အား! ထက်ထက်၏ ခြေထောက် နာသွားသည်။","နေနေသည် ဘုရားကျောင်းကို လမ်းလျှောက်သွားနေသည်။ သူ၏အဖွားက သူ့အား အမွှေးတိုင်ထွန်းခိုင်းခဲ့သည်။ နေနေက သူ့အဖွားကို ကူညီရလို့ ပျော်နေသည်။ သို့သော် သူသည် လမ်းပေါ်ရှိ ကျောက်တုံးကို သတိမထားမိဘဲ ခလုတ်တိုက်မိသွားသည်။  အား! ​နေ​နေ၏ ခြေ​ထောက်​ နာကျင်သွားသည်။","သူရသည် မြစ်ကမ်းဆီသို့ လမ်းလျှောက်နေသည်။ သူ၏အဖေသည် ့အား ရေသွားခပ်ခိုင်းသည်။ သူရက သူ့အဖေကို ကူညီရလို့ ပျော်နေသည်။ သို့သော် သူသည် သစ်ပင်မှအမြစ်ထွက်နေသည်ကို မမြင်ဘဲ ခလုတ်တိုက်မိသွားသည်။ အား! သူရ၏ ခြေထောက်နာကျင်သွားသည်။"],"tc_q1":["၁။ ချမ်ပို  ဘာကြောင့်ဆိုင်ကိုသွားသလဲ။","၁) မေက ဘာကြောင့် စာအုပ်ဆိုင်ကို သွားသလဲ။","၁) ထက်ထက် ပန်းခြံကို ဘာကြောင့် သွားရသလဲ။","၁။ နေနေရဲ့အဖွားက ဘုရားကျောင်းမှာ ဘာလုပ်ခိုင်းသလဲ။","၁) သူရဘာကြောင့် မြစ်ကမ်းသို့သွားရသလဲ။"],"tc_a1":["အဖြေမှန်။ ပေါင်မုန့်ဝယ်ရန်","အဖြေမှန် - မှတ်စုစာအုပ်အသစ်ဝယ်ရန်","အဖြေမှန် - ဘောလုံးယူရန်","အဖြေမှန်-အမွှေးတိုင်ထွန်းရန်","အဖြေမှန်- ရေခပ်ရန်"],"tc_q2":["၂။ ချမ်ပို ရဲ့ ခြေဖဝါး ဘာကြောင့် အနာဖြစ်သလဲ။","၂။ မေ ဘာကြောင့်ခြေထောက်နာကျင်ရသလဲ။","၂။ ထက်ထက်ခြေထောက် ဘာကြောင့် နာကျင်နေရတာလဲ။","၂။နေနေဘာကြောင့်ခြေထောက်အနာဖြစ်ရသလဲ။","၂။ သူရခြေထောက်ဘာကြောင့်နာကျင်ရသလဲ။"],"tc_a2":["အဖြေမှန်။ ခြေထောက်ချော်လဲသည်။","အဖြေမှန်။ ခြေထောက်ခလုတ်တိုက်မိသည်။","အဖြေမှန်။ ခြေထောက်ခလုတ်တိုက်မိသည်။","အဖြေမှန်။ ခြေထောက်ခလုတ်တိုက်မိသည်။","အဖြေမှန်။ ခြေထောက်ခလုတ်တိုက်မိသည်။"],"tc_text_2":["ရန်ကုန်မြို့တွင် လူထုစာကြည့်တိုက်သစ်ဖွင့်ပွဲ။\n\nရန်ကုန်မြို့တွင် ပြီးခဲ့သည့် သီတင်းပတ်ကုန်က လူထုစာကြည့်တိုက် ဖွင့်ပွဲကို ကျင်းပခဲ့သည်။ ခေတ်မီဆန်းသစ်သော အဆောက်အအုံသည် သင်ယူမှုနှင့် ရပ်ရွာလှုပ်ရှားမှုများအတွက် အချက်အချာကျသော နေရာတစ်ခုဖြစ်လာမည့်အလားအလာရှိသည်။ စာကြည့်တိုက်တွင် စာအုပ်များ၊ ဒစ်ဂျစ်တယ် အရင်းအမြစ်များ အများအပြား စုဆောင်းထားပြီး လေ့လာရန်နှင့် အပန်းဖြေရန် နေရာများ လည်းထားရှိသည်။\n\nမြို့တော်မှ စာအုပ်ဈေးရောင်းပွဲများ၊ စာဖတ်ပြိုင်ပွဲများနှင့် စာရေးဆရာများနှင့် တွေ့ဆုံမိတ်ဆက်ပွဲများကဲ့သို့သော ပွဲများကျင်းပရန် စီစဉ်ထားသည်။ အဆိုပါ ဆောက်လုပ်ရေးလုပ်ငန်းကို ယူနီဆက် မှ ဒေသခံများနှင့် ပူးပေါင်း၍ ပံ့ပိုးကူညီခဲ့ခြင်း ဖြစ်သည်။ စာကြည့်တိုက်ဖွင့်လှစ်ရခြင်းမှာအများသူငှာ အသက်အရွယ်မရွေး လူတိုင်း စာဖတ်ခြင်းနှင့် သင်ယူခြင်းကို ချစ်မြတ်နိုးတတ်စေရန် ရည်ရွယ်ပါသည်။","ဆိုလာပြားတွေက ညောင်ကျေးရွာကို အလင်းပေး။\n\nညောင်ကျေးရွာသည် မကြာသေးမီက ဆိုလာပြားများ တပ်ဆင်ထားသောကြောင့် ဒေသခံများအတွက် အလင်းရောင်နှင့် မျှော်လင့်ချက်များယူဆောင်လာခဲ့သည်။ ဤအစိမ်းရောင်စီမံကိန်းသည် ကျေးရွာအတွက် ရေရှည်တည်တံ့ခိုင်မြဲပြီး ယုံကြည်စိတ်ချရသောလျှပ်စစ်ဓာတ်အားအရင်းအမြစ်ကိုသေချာရရှိစေပြီး လူတိုင်း၏လူနေမှုဘဝကိုတိုးတက်စေပါသည်။\n\nလမ်းမီးများ တပ်ဆင်ခြင်းသည် ရွာသူရွာသားများအတွက် ညဘက်သွားလာရန် ပိုမိုလွယ်ကူပြီး ဘေးကင်းစေသည်။ ငါးလကြာမြင့်မည့်ထိုစီမံကိန်းကို အစိုးရနှင့်ပုဂ္ဂလိကကဏ္ဍ ပေါင်းစပ် ရန်ပုံငွေဖြင့်ထောက်ပံ့ကူညီခဲ့သည်။ ရှေ့ဆက်ပြီးယခုကဲ့သို့ တိုးတက်မှုများ ရှိလာဖို့ ရွာက မျှော်လင့်သည်။","သရက်ကျေးရွာက ရေစုပ်စက်အသစ်ရဲ့ အကျိုးကျေးဇူး။\n\nသရက်ကျေးရွာတွင် ရေစုပ်စက်အသစ် တပ်ဆင်ခြင်းဖြင့်ထိုရွာ၏ ရေပေးဝေမှုတွင် သိသာထင်ရှားသော တိုးတက်မှုကို မြင်တွေ့ခဲ့ရသည်။ ဤ ဖွံ့ဖြိုးတိုးတက်မှုသည် ရွာသူရွာသားများ ယခင်က ရေခပ်ရန်အတွက် အကွာအဝေးများစွာ ခရီးသွားခဲ့ရသည့် ဝန်ထုပ်ဝန်ပိုးကို လျော့ချပေးကာ သန့်ရှင်း၍ ယုံကြည်စိတ်ချရသော ရေကို ရရှိစေရန် အထောက်အကူပြုမည်ဖြစ်သည်။\n\n\nဒေသခံကျောင်းဆရာတစ်ဦးဖြစ်သူ ကိုအောင်မျိုးက ဤရေစုပ်စက်အသစ်ကြောင့် သန့်ရှင်းသောရေကို ရရှိပြီဖြစ်၍ ကျောင်းသားများ၏ ကျောင်းပျက်ရက်များကို လျော့ကျစေကြောင်း ပြောကြားခဲ့သည်။ ရေစုပ်စက်အသစ်နှစ်လုံး တပ်ဆင်ခြင်းသည် နိုင်ငံတကာအကူအညီပေးရေးအဖွဲ့များမှ ရန်ပုံငွေပံ့ပိုးပေးထားသည့် ပိုမိုကျယ်ပြန့်သော ပဏာမခြေလှမ်း၏ တစ်စိတ်တစ်ပိုင်းဖြစ်သည်။","ကျွန်းတောကျေးရွာတွင် ကျန်းမာရေး ဆေးခန်းအသစ်ဖွင့်လှစ်ခြင်း။\n\nကျွန်းတောကျေးရွာတွင် ကျန်းမာရေးဆေးပေးခန်းအသစ်ဖွင့်လှစ်ခြင်းသည် ရပ်ရွာကျန်းမာရေးစောင့်ရှောက်မှုလုပ်ငန်းများတွင် သိသာထင်ရှားသော ခြေလှမ်းတစ်ရပ်ဖြစ်သည်။ ဆေးခန်းတွင် ကာကွယ်ဆေးထိုးခြင်း၊ မိခင်နှင့်ကလေးကျန်းမာရေးဝန်ဆောင်မှုများနှင့် အထွေထွေကျန်းမာရေးစောင့်ရှောက်မှုများဆောင်ရွက်ပေးရန် ဖြစ်သည်။\n\nဤဆေးခန်းကို ယူနီဆက် နှင့် ဒေသခံရွာသူရွာသားတို့၏ ပူးပေါင်းပါဝင်မှုဖြင့် ငွေကြေးထောက်ပံ့ခဲ့ခြင်းဖြစ်ပြီး၊ ကျန်းမာရေးဆိုင်ရာရလဒ်များ ပိုမိုကောင်းမွန်လာစေရန် ရည်ရွယ်သည့် အောင်မြင်သော ပူးပေါင်းဆောင်ရွက်မှုကို မီးမောင်းထိုးပြနေသည်။ ရွာသူရွာသားများအနေဖြင့် ဤဆေးခန်းသည် ကျေးရွာ၏ ဆေးဘက်ဆိုင်ရာလိုအပ်ချက်များကို ဖြည့်ဆည်းပေးပြီး ကာကွယ်နိုင်သောရောဂါများ ဖြစ်ပွားမှုကို လျှော့ချနိုင်မည်ဟု မျှော်လင့်နေကြသည်။","မှော်ဘီကျေးရွာမှ ကျောင်းအသစ်ကို ကြိုဆိုခြင်း။\n\nမှော်ဘီကျေးရွာတွင် ပြီးခဲ့သည့်အပတ်က ကျောင်းဆောင်သစ်ဖွင့်ပွဲကို ကျင်းပခဲ့သည်။ အဆိုပါ ကျောင်းတွင် စာသင်ခန်း ငါးခန်းပါဝင်ပြီး ရွာနှင့် အနီးပတ်ဝန်းကျင်ရှိ ကလေးငယ်များအတွက် အရည်အသွေးရှိသော ပညာရေးကို ပံ့ပိုးပေးနိုင်ရန် ရည်ရွယ်သည်။\n\nကျောင်းသားမိဘတစ်ဦးဖြစ်သူ ကိုမင်းဇော်က ၎င်း၏ကလေးနှစ်ဦးအပြင် ရွာရှိ ကလေးငယ်များစွာအတွက်ပါ အကျိုးပြုမည့် ကျောင်းဖြစ်သောကြောင့် အလွန်ပင် ကျေးဇူးတင်ရှိကြောင်း ပြောကြားခဲ့သည်။ အဆိုပါကျောင်းကို အစိုးရရန်ပုံငွေနှင့် ဒေသခံပြည်သူများ၏ ပူးပေါင်းပါဝင်မှုဖြင့် တည်ဆောက်ခဲ့ခြင်းဖြစ်ပြီး ကျေးရွာရှိ ကလေးများ၏ အနာဂတ်အပေါ် ထားရှိသည့် ကတိကဝတ်ကို ပြသနေခြင်းပင်ဖြစ်သည်။"],"tc_q3":["မြို့တွင်ကျင်းပမည့်စာကြည့်တိုက်အသစ်၏ အစီအစဉ်တစ်ခုအား ဖော်ပြပါ။","၁။ ယခုအခါတွင် ရွာသားများအတွက် ညဘက်သွားလာရန် ပိုမိုလွယ်ကူပြီး ဘေးကင်းစေရန် မည်သည့်အရာက ပြုလုပ်ပေးသနည်း။","၁။ရေစုပ်စက်အသစ်နဲ့ ပတ်သက်ပြီး ဒေသခံကျောင်းဆရာ ကိုအောင်မျိုးက ဘာပြောသလဲ။","၁။ ကျွန်းတောကျေးရွာရှိ ကျန်းမာရေးဆေးခန်းအသစ်၏ ဝန်ဆောင်မှုတစ်ခုကိုဖော်ပြပါ။","၁။ကျောင်းအသစ်တွင် စာသင်ခန်းမည်မျှရှိသနည်း။"],"tc_a3":["ဖြစ်နိုင်သော အဖြေများ- \n- စာအုပ်ပွဲတော်\n- စာဖတ်ပြိုင်ပွဲများ\n- စာရေးဆရာများနှင့် တွေ့ဆုံမိတ်ဆက်ပွဲများ","အဖြေမှန်- လမ်းမီးများ တပ်ဆင်ခြင်း","အဖြေမှန်- ကျောင်းသူကျောင်းသားများဖျားနာသည့်ရက်အရေအတွက်ကို လျှော့ချပေးသည်။","ဖြစ်နိုင်သော အဖြေများ- \n- ကာကွယ်ဆေးထိုးခြင်း။\n- မိခင်နှင့်ကလေးကျန်းမာရေးဝန်ဆောင်မှုများ။\n- အထွေထွေ ကျန်းမာရေး စောင့်ရှောက်မှုများ။","အဖြေမှန် -စာသင်ခန်း ၅ ခန်း"],"tc_q4":["စာကြည့်တိုက်ဆောက်လုပ်ရန် မည်သူ့က ငွေကြေးထောက်ပံ့ခဲ့သနည်း။","၂။ညောင်ကျေးရွာသို့ ဆိုလာပြားများ ယူဆောင်လာရန် လပေါင်းမည်မျှကြာအောင် စီစဉ်ခဲ့သနည်း။","၂။ ရေစုပ်စက်အသစ်မည်မျှတပ်ဆင်ထားသနည်း။","၂။ ကျန်းမာရေး ဆေးခန်း ဆောက်လုပ်ရန် မည်သူ့က ငွေကြေး ထောက်ပံ့ခဲ့သနည်း။","၂။ ကလေးမိဘကိုမင်းဇော်တွင် ကလေးမည်မျှရှိသနည်း။"],"tc_a4":["အဖြေမှန် - ယူနီဆက် နှင့် ဒေသခံပြည်သူများ၊","အဖြေမှန်- ၅ လ","အဖြေမှန် - ၂ လုံး","အဖြေမှန်- ယူနီဆက်နှင့် ဒေသခံအသိုင်းအဝိုင်း","အဖြေမှန်- ကလေး ၂ယောက်"],"sd_add":["၁။ ၅+ ၃\n\n၂။ ၂+၄","၁။ ၃+၄\n\n၂။ ၈+၇","၁။ ၂+၆\n\n၂။ ၉+၈","၁။ ၄+၁\n\n၂။ ၉+၉","၁။ ၃+၂\n\n၂။ ၇+၆"],"sd_add_ans":["၁။ ၈\n\n၂။ ၆","၁။ ၇\n\n၂။ ၁၅","၁။ ၈\n\n၂။ ၁၇","၁။ ၅\n\n၂။ ၁၈","၁။ ၅\n\n၂။ ၁၃"],"dd_add":["၁။ ၁၂+၂၄\n\n၂။ ၁၅+၃၂","၁။၁၀+ ၃၆\n\n၂။ ၂၈+၁၇","၁။ ၁၄+၂၉\n\n၂။ ၃၇+၄၈","၁။ ၅၃+ ၁၆\n\n၂။ ၂၅+ ၃၈","၁။ ၅၇+ ၁၄\n\n၂။ ၃၅+၂၇"],"dd_add_ans":["၁။ ၃၆\n\n၂။ ၄၇","၁။ ၄၆\n\n၂။ ၄၅","၁။ ၄၃\n\n၂။ ၈၅","၁။ ၆၉\n\n၂။ ၆၃","၁။ ၇၁\n\n၂။ ၆၂"],"sd_sub":["၁။ ၅ - ၃\n\n၂။ ၉ - ၄","၁။၈ - ၃\n\n၂။ ၆ - ၄","၁။ ၄ - ၁\n\n၂။ ၆ - ၅","၁။ ၈ - ၅\n\n၂။ ၅ - ၂","၁။ ၄ - ၂\n\n၂။ ၉ - ၆"],"sd_sub_ans":["၁။ ၂\n\n၂။ ၅","၁။ ၅\n\n၂။ ၂","၁။ ၃\n\n၂။ ၁","၁။ ၃\n\n၂။ ၃","၁။ ၂\n\n၂။ ၃"],"dd_sub":["၁။ ၃၆ - ၁၂\n\n၂။ ၄၈ - ၁၆","၁။ ၃၀ - ၈\n\n၂။ ၄၂ - ၁၇","၁။ ၆၃ - ၃၈\n\n၂။ ၅၀ - ၁၅","၁။ ၇၂ - ၃၃\n\n၂။ ၆၉ - ၂၈","၁။ ၄၁ - ၁၄\n\n၂။ ၅၅ - ၂၆"],"dd_sub_ans":["၁။ ၂၄\n\n၂။ ၃၂","၁။ ၂၂\n\n၂။ ၂၅","၁။ ၂၅\n\n၂။ ၃၅","၁။ ၃၉\n\n၂။ ၄၁","၁။ ၂၇\n\n၂။ ၂၉"],"sd_mul":["၁။  ၅ x ၅\n\n၂။ ၈ x ၇","၁။ ၃ x ၇\n\n၂။ ၆ x ၆","၁။ ၅ x ၇\n\n၂။ ၄ x ၈","၁။ ၆ x ၇\n\n\n၂။ ၉ x ၉","၁။ ၈ x ၉\n\n၂။ ၄ x ၅"],"sd_mul_ans":["၁။ ၂၅\n\n၂။ ၅၆","၁။ ၂၁\n\n\n၂။ ၃၆","၁။ ၃၅\n\n၂။ ၃၂","၁။ ၄၂\n\n\n၂ ား ဖြစ်ကြသည်။","ဝေလငါးများသည် သမုဒ္ဒရာထဲတွင် အကြီးဆုံးသော ရေသတ္တဝါများ ဖြစ်ကြသည်။","ပင်ဂွင်းဌက်များသည် ရေကူးအရမ်းတော်ကြပြီး အေးသောဒေသများတွင် နေထိုင်ကြပါသည်။","သားပိုက်ကောင်မျးသည် သူတို့၏ကလေးများကို ဗိုက်အိတ်ထဲတွင် သယ်ဆောင်ကြသည်။"],"g5I2_passage":["ဝါကျ။ ကျွန်တော့်အစ်ကိုသည် စနေနေ့တိုင်း ဘောလုံး_______။","ဝါကျ။ သူမသည် နေ့တိုင်း ဘတ်စ်ကားဖြင့် ကျောင်းကို________ ။","ခွေးက ညဘက်မှာ ကျယ်လောင်စွာ ____ သည်။","ကျွန်တော်တို့ နေ့လယ် ၁၂ နာရီမှာ နေ့လယ်စာ ____ သည်။"],"g5I2_question":["မှန်ကန်သော ကြိယာကိုရွေးချယ်ပြီး ဝါကျကို ဖြည့်စွက်ပါ-","မှန်ကန်သော ကြိယာကိုရွေးချယ်ပြီး ဝါကျကို ဖြည့်စွက်ပါ-","မှန်ကန်သော ကြိယာကိုရွေးချယ်ပြီး ဝါကျကို ဖြည့်စွက်ပါ-","မှန်ကန်သော ကြိယာကိုရွေးချယ်ပြီး ဝါကျကို ဖြည့်စွက်ပါ-"],"g5I2_answer":["ကစားသည်။","သွားသည်။","အော်သည်။","စားသည်။"],"g6I1_passage":["ဖာတီမာသည် စာမေးပွဲအတွက် ညတိုင်း စာကျက်သည်။ သူမသည်  မနက်စောစောထပြီး ပြန်လည်လေ့ကျင့်ခန်းများပြုပြီး အသေးစိတ်မှတ်စုများ ပြုလုပ်သည်။ သူမ နားမလည်သည့်အခါတိုင်း ဆရာကို အမြဲတမ်းမေးမြန်း အကူအညီတောင်းခံသည်။ သူမ ပင်ပန်းနေသည့်တိုင် အောင်မြင်လိုစိတ်ရှိသောကြောင့် ဆက်လက်ကြိုးစားသည်။ စာမေးပွဲဖြေမည့်နေ့တွင် သူမသည် သေချာပြင်ဆင်ထားသောကြောင့် ယုံကြည်မှုရှိနေသည်။","အဲလက်စ်သည် သစ်လုံးအိမ်ဆောက်ရန် သူ့၏ပိတ်ရက်များကို အသုံးပြုခဲ့သည်။ သူသည် အိမ်ဆောက်ပုံ နည်းလမ်းများကို ဗီဒီယိုများကြည့်ရှုခြင်း၊ လမ်းညွှန်ချက်များ ဖတ်ရှုခြင်းနှင့် အကြံဉာဏ်များ တောင်းခံခြင်းများ ပြုလုပ်ခဲ့သည်။ မှားယွင်းမှုများရှိခဲ့သော်လည်း သူလက်မလျှော့ခဲ့ပေ။ ရက်သတ္တပတ်များစွာကြာပြီးနောက် သစ်လုံးအိမ်လေးသည် ပြီးစီးခဲ့သည်။","တာရာသည် သူ့အတန်းဖော်သူငယ်ချင်းများကို သင်္ချာပုစ္ဆာများ နားလည်အောင် ကူညီပေးခဲ့တယ်။ သူက စိတ်ရှည်ရှည်နဲ့ ရှင်းပြပေးပြီး လူတိုင်းပါဝင်နိုင်အောင်လည်း သေချာဂရုစိုက်ရှင်းပြပေးခဲ့သည်။ သူ့ရဲ့ အတန်းဖော်များကလည်း သူ့ရဲ့အကူအညီအတွက် ကျေးဇူးတင်ခဲ့ကြပြီး သူ့ကိုလည်း လေးစားခဲ့ကြသည်။","ဆိုဖီသည် ကျောင်းအရည်အချင်းပြပွဲတွင် ဖျော်ဖြေရန်အတွက် စိုးရိမ်ပူပန်နေပါသည်။ သူမဟာ ရက်သတ္တပတ်များစွာကြာအောင် လေ့ကျင့်ခဲ့ပေမဲ့ သူမအလှည့်ရောက်တော့ လက်တွေ တုန်ရီနေပါသည်။ ဂီတသံ စတင်လာတဲ့အခါ သူမဟာ အသက်ပြင်းပြင်း ရှူသွင်းပြီး အာရုံစိုက်လိုက်ပါသည်။ သီချင်းတီးနေရင်းနဲ့ စိုးရိမ်စိတ်တွေ လွင့်ပျယ်သွားပြီး ဖျော်ဖြေမှုအဆုံးမှာ သူမရဲ့ကြောက်စိတ်ကို ရင်ဆိုင်နိုင်ခဲ့သည့်အတွက် ကိုယ့်ကိုယ်ကို ဂုဏ်ယူနေနေပါသည်။"],"g6I1_question":["ဖာတီမာသည် သူမကြုံတွေ့ရသည့် စိန်ခေါ်မှုများကို မည်သို့တုံ့ပြန်ခဲ့ပြီး၊ ၎င်းသည် ဇာတ်လမ်း၏ အဆုံးပိူင်းတွင် မည်သို့အထောက်အကူပြုခဲ့သနည်း။","အဲလက်စ်သည် သစ်လုံးအိမ်ဆောက်လုပ်ရာတွင် ကြုံတွေ့ရသည့် စိန်ခေါ်မှုများကို မည်သို့တုံ့ပြန်ခဲ့သနည်း၊ ရလဒ်က မည်သို့ဖြစ်ခဲ့သနည်း။","တာရာသည် အတန်းဖော်သူငယ်ချင်းများနဲ့ပတ်သက်သော အခြေအနေကို မည်သို့တုံ့ပြန်ခဲ့သလဲ။ ထို တုံ့ပြန်မှုသည့် ဇာတ်လမ်းရဲ့နိဂုံး  ကို မည်သို့ အကျိုးသက်ရောက်စေသနည်း။","ဆိုဖီသည် သူမ၏စိုးရိမ်စိတ်ကို မည်သို့ တုံ့ပြန်ခဲ့သလဲ။ သူမဖျော်ဖြေမှု၏ ရလဒ်အနေဖြင့် မည်သို့ဖြစ်ခဲ့ပါသနည်း။"],"g6I1_options":["ဖာတီမာသည် စာမကျက်ခြင်းကြောင့် ရလဒ်အနေဖြင့် စာမေးပွဲကျသွားသည်။\nအခြေအနေများ ခက်ခဲလာသောအခါ ဖာတီမာသည် လက်လျှော့လိုက်ခြင်းကြောင့် တိုးတက်မှုမရှိပေ။\n\nဖာတီမာသည် စာကြိုးစားပြီး လိုအပ်သည့်အခါတိုင်း ဆရာမထံ မေးမြန်းအကူအညီတောင်းခံသည့်အတွက် စာမေးပွဲဖြေမည့်နေ့တွင် ယုံကြည်မှုရှိနေသည်။\n\nဖာတီမာသည် အနားမယူဘဲ စာကျက်သောကြောင့် စာမေးပွဲနေ့တွင် စိတ်ပင်ပန်းနွမ်းနယ်နေသည်။","အဲလက်စ်သည် အကူအညီမပါဘဲ သစ်လုံးအိမ်ကို ဆောက်လုပ်ခဲ့ရာ အမှားများစွာကြောင့် စီမံကိန်းပျက်စီးသွားခဲ့သည်။\n\nအဲလက်စ်သည် သစ်လုံးအိမ်ကို စတင်ဆောက်လုပ်ခဲ့သော်လည်း ခက်ခဲကြောင်းသိလိုက်သောအခါ ရပ်တန့်လိုက်သည်။\n\nအဲလက်စ်သည် သူ့အမှားများကြောင့် စိတ်ပျက်အားငယ်ကာ စီမံကိန်းကို စွန့်လွှတ်လိုက်သည်။\n\nအဲလက်စ်သည် အမှားများရှိသော်လည်း ကြိုးစားနေခဲ့ပြီး နောက်ဆုံးတွင် သစ်လုံးအိမ်ကို ပြီးစီးအောင် ဆောက်လုပ်နိုင်ခဲ့သည်။","တာရာသည် သူ၏အတန်းဖော်သူငယ်ချင်းများကို စိတ်ပျက်ပြီး စာရှင်းပြခြင်းကို ရပ်လိုက်သည်။\n\nတာရာသည် သူ၏အတန်းဖော်သူငယ်ချင်းများကို လျစ်လျူရှုပြီး သင်္ချာပုစ္ဆာများကို မကူညီပေ။\n\nတာရာသည် သူ၏အတန်းဖော်သူငယ်ချင်းများကို စိတ်ရှည်စွာ ရှင်းပြပြီး ကူညီပေးသောကြောင့် သူတို့၏လေးစားမှုကို ရရှိခဲ့သည်။\n\nတာရာသည် ကူညီရန် ကြိုးစားသော်လည်း သူ၏အတန်းဖော်သူငယ်ချင်းများက တန်ဖိုးမထားကြပေ။","ဆိုဖီသည် ဖျော်ဖြေနေစဥ် သူမ၏သီချင်းစာသားများကို မေ့သွားပြီး စိတ်ပျက်အားငယ်သွားပါသည်။\n\nဆိုဖီသည် သူမ၏ကြောက်စိတ်ကို ရင်ဆိုင်ခဲ့ပြီး နောက်ဆုံးတွင် သူမ၏ဖျော်ဖြေမှုအတွက် ကိုယ့်ကိုယ်ကို ဂုဏ်ယူနေနေသည်။\n\nဆိုဖီသည် အလွန်အမင်း စိုးရိမ်စိတ်များကြောင့် ဖျော်ဖြေနိုင်ခြင်းမရှိဘဲ စင်ပေါ်မှ ဆင်းသွားခဲ့သည်။\n\nဆိုဖီသည် သူမ၏စိုးရိမ်စိတ်ကို ထိန်းချုပ်နိုင်ခြင်းမရှိသည့်အတွက် ဖျော်ဖြေမှုသ် ဆိုးရွားသွားခဲ့သည်။"],"g6I1_answer":["ဖာတီမာသည် ကြိုးစားပြီး လိုအပ်သည့်အခါတိုင်း ဆရာမထံ မေးမြန်းအကူအညီတောင်းခံသည့်အတွက် စာမေးပွဲနေ့တွင် ယုံကြည်မှုရှိသည်။","အဲလက်စ်သည် အမှားများရှိသော်လည်း ကြိုးစားခဲ့သောကြောင့် နောက်ဆုံးတွင် သစ်လုံးအိမ်ကို ပြီးစီးအောင် ဆောက်လုပ်နိုင်ခဲ့သည်။",null,"ဆိုဖီသည် သူမ၏ကြောက်စိတ်ကို ရင်ဆိုင်ခဲ့ပြီး နောက်ဆုံးတွင် သူမ၏ဖျော်ဖြေမှုအတွက် ကိုယ့်ကိုယ်ကို ဂုဏ်ယူနေသည်။"],"g6I2_question":["အောက်ပါစာကြောင်းများထဲမှ မည်သည့်က အတွေ့အကြုံခံစားမှုတစ်ခုကို ဖော်ပြရန်အတွက် အသေးစိတ်အချက်အလက်များ (သို့မဟုတ်)တိကျမှု ကို ဖော်ပြသနည်း။ (အားလုံးကိုရွေးပါ)","အောက်ပါစာကြောင်းများထဲမှ မည်သည့်က အတွေ့အကြုံခံစားမှုတစ်ခုကို ဖော်ပြရန်အတွက် အသေးစိတ်အချက်အလက်များ (သို့မဟုတ်)တိကျမှု ကို ဖော်ပြသနည်း။ (အားလုံးကိုရွေးပါ)","အောက်ပါစာကြောင်းများထဲမှ မည်သည့်က အတွေ့အကြုံခံစားမှုတစ်ခုကို ဖော်ပြရန်အတွက် အသေးစိတ်အချက်အလက်များ (သို့မဟုတ်)တိကျမှု ကို ဖော်ပြသနည်း။ (အားလုံးကိုရွေးပါ)","အောက်ပါစာကြောင်းများထဲမှ မည်သည့်က အတွေ့အကြုံခံစားမှုတစ်ခုကို ဖော်ပြရန်အတွက် အသေးစိတ်အချက်အလက်များ (သို့မဟုတ်)တိကျမှု ကို ဖော်ပြသနည်း။ (အားလုံးကိုရွေးပါ)"],"g6I2_options":["ကျောင်းဝင်းကို သန့်ရှင်းရေးလုပ်ရန် စေတနာ့ဝန်ထမ်းလုပ်ခြင်းနှင့် အရာအားလုံးကို သပ်ရပ်သေသပ်စွာ စီစဉ်ခြင်း။\n\nခွင့်ပြုချက်မရှိဘဲ အပိုအစာယူခြင်း။\n\nဆာလောင်နေသော အတန်းဖော်တစ်ဦးနှင့် အစားအစာများ မျှဝေစားသောက်ခြင်း၊ ၎င်းတို့၏ မျက်နှာ ဝင်းပသွားသည်ကို ကြည့်ရှုခြင်း။\n\nအငယ်တန်းကျောင်းသားတစ်ဦးအား ၎င်းတို့၏ မေးခွန်းများကို ဂရုတစိုက်နားထောင်ရင်း အိမ်စာကူညီပေးခြင်း။\n\nအကူအညီလိုအပ်နေသော သူငယ်ချင်းတစ်ဦးကို လျစ်လျူရှုခြင်း။\n\nသက်ကြီးရွယ်အိုတစ်ဦးအတွက် ကုန်ခြောက်ထုပ်များ သယ်ယူပေးစဉ် မိမိ၏ လက်ထဲရှိ အလေးချိန်ကို ခံစားရခြင်း။","အမိုးအကာမဲ့သူများအတွက် အဝတ်အထည် လှူဒါန်းခြင်းနှင့် အဝတ်အထည်များ၏ နွေးထွေးမှုကို ဖော်ပြခြင်း။\n\nကြမ်းပြင်ပေါ်သို့ အမှိုက်ပစ်ခြင်း။\n\nလဲကျသွားသူတစ်ဦးကို ရယ်မောခြင်း။\n\nအခြားသူတစ်ဦး၏ အိမ်စာကို ကူးချခြင်း။\n\nလေးလံသော စာအုပ်များကို သယ်ဆောင်ရာတွင် ကြွက်သားများ နာကျင်မှုကို ခံစားရခြင်း။\n\nလမ်းပျောက်နေသူတစ်ဦးအား လမ်းကို ရှင်းလင်းစွာ ဖော်ပြ၍ လမ်းညွှန်ပေးခြင်း။","ပန်းခြံထဲတွင် အမှိုက်များကို ကောက်ရင်း သဘာဝရဲ့အသံများကို သတိထားနားဆင်မိခြင်း။\n\nငှားထားသောပစ္စည်းကို ပြန်ပေးဖို့ မေ့နေခြင်း။\n\nအတန်းဖော်သူငယ်ချင်းတစ်ယောက်ကို စာပြပေးရန် အကြောင်းအရာတစ်ခုကို ရှင်းပြဖို့ စကားလုံးများကို သေချာစွာရွေးချယ်ခြင်း။\n\nတခြားသူများအတွက် တံခါးဖွင့်ပေးထားရင်း အေးမြတဲ့လေကို အရေပြားပေါ်မှ ခံစားမိခြင်း။\n\nစာမေးပွဲဖြေနေစဥ် စကားပြောခြင်း။","ရန်ပုံငွေပွဲအတွက် ဆိုင်းဘုတ်များ ဆေးခြယ်ရင်း အရောင်တွေကို ဂရုတစိုက် ရောစပ်နေခြင်း။\n\nညွှန်ကြားချက်များကို လျစ်လျူရှုခြင်း။\n\nညီ/ ညီမလေးကို စာဖတ်ပြရင်း သူတို့၏ စိတ်လှုပ်ရှားမှုကို သတိထားမိခြင်း။\n\nဆရာ/ဆရာမတစ်ယောက်၏ ပစ္စည်းများ ကို ကူသယ်ပေးရင်း ကိုင်ထားသော စာအုပ်များ၏ အလေးချိန်ကို ခံစားမိခြင်း။\n\nကန်တင်းတွင် ရှုပ်ပွအောင် ထားခဲ့ခြင်း။\n\nပစ္စည်းများကို မဝေမျှခြင်း။"],"g6I2_answer":["ကျောင်းဝင်းကို သန့်ရှင်းရေးလုပ်ရန် စေတနာ့ဝန်ထမ်းလုပ်ခြင်းနှင့် အရာအားလုံးကို သပ်ရပ်သေသပ်စွာ စီစဉ်ခြင်း။\n\nဆာလောင်နေသော အတန်းဖော်တစ်ဦးနှင့် အစားအစာများ မျှဝေစားသောက်ခြင်း၊ ၎င်းတို့၏ မျက်နှာ ဝင်းပသွားသည်ကို ကြည့်ရှုခြင်း။\n\nအငယ်တန်းကျောင်းသားတစ်ဦးအား ၎င်းတို့၏ မေးခွန်းများကို ဂရုတစိုက်နားထောင်ရင်း အိမ်စာကူညီပေးခြင်း။\n\nသက်ကြီးရွယ်အိုတစ်ဦးအတွက် ကုန်ခြောက်ထုပ်များ သယ်ယူပေးစဉ် မိမိ၏ လက်ထဲရှိ အလေးချိန်ကို ခံစားရခြင်း။","အမိုးအကာမဲ့သူများအတွက် အဝတ်အထည် လှူဒါန်းခြင်းနှင့် အဝတ်အထည်များ၏ နွေးထွေးမှုကို ဖော်ပြခြင်း။\n\nလေးလံသော စာအုပ်များကို သယ်ဆောင်ရာတွင် ကြွက်သားများ တောင့်တင်းနာကျင်မှုကို ခံစားရခြင်း။\n\nလမ်းပျောက်နေသူတစ်ဦးအား လမ်းကို ရှင်းလင်းစွာ ဖော်ပြ၍ လမ်းညွှန်ပေးခြင်း။","ပန်းခြံထဲတွင် အမှိုက်များကို ကောက်ရင်း သဘာဝရဲ့အသံများကို သတိထားနားဆင်မိခြင်း။\n\nအတန်းဖော်သူငယ်ချင်းတစ်ယောက်ကို စာပြပေးရန် အကြောင်းအရာတစ်ခုကို ရှင်းပြဖို့ စကားလုံးများကို သေချာစွာရွေးချယ်ခြင်း။\n\nတခြားသူများအတွက် တံခါးဖွင့်ပေးထားရင်း အေးမြတဲ့လေကို အရေပြားပေါ်မှ ခံစားမိခြင်း။","ရန်ပုံငွေပွဲအတွက် ဆိုင်းဘုတ်များ ဆေးခြယ်ရင်း အရောင်တွေကို ဂရုတစိုက် ရောစပ်နေခြင်း။\n\nညီ/ ညီမလေးကို စာဖတ်ပြရင်း သူတို့၏ စိတ်လှုပ်ရှားမှုကို သတိထားမိခြင်း။\n\nဆရာ/ဆရာမတစ်ယောက်၏ ပစ္စည်းများ ကို ကူသယ်ပေးရင်း ကိုင်ထားသော စာအုပ်များ၏ အလေးချိန်ကို ခံစားမိခြင်း။"],"g5I1_options":["သစ်ကုလားအုတ်များသည် အန္တရာယ်ရှိသော တိရစ္ဆာန်များဖြစ်သည်။\nသစ်ကုလားအုတ်များသည် အအေးပိုင်းဒေသများတွင် နေထိုင်ကြသည်။\nသစ်ကုလားအုတ်များသည် အသားစား တိရစ္ဆာန်များဖြစ်သည်။\nသစ်ကုလားအုတ်များသည် အရပ်အရှည်ဆုံးသော တိရစ္ဆာန်များဖြစ်သည်။","ဝေလငါးများသည် သစ်ကုလားအုတ်များကို စားသည်။\n\nဝေလငါးများသည် ကုန်းပေါ်တွင် နေထိုင်သည်။\n\nဝေလငါးများသည် သမုဒ္ဒရာထဲတွင် အကြီးဆုံးသော တိရစ္ဆာန်များဖြစ်သည်။\n\nဝေလငါးများသည် တွားသွားသတ္တဝါများဖြစ်သည်။","ပင်ဂွင်းငှက်သည်သဲကန္တာရထဲတွင် နေထိုင်ကြပါသည်။\n\nပင်ဂွင်းငှက်သည် အရမ်းမြင့်အောင် ပျံသန်းနိုင်ကြသည်။\n\nပင်ဂွင်းငှက်သည် ရေကူးအရမ်းတော်ကြပြီး အေးသောဒေသများတွင် နေထိုင်ကြသည်။\n\nပင်ဂွင်းငှက်သည် အပင်များကို စားသုံးကြသည်။","သားပိုက်ကောင်များသည် ရေထဲတွင် နေထိုင်ကြပါသည်။\n\nသားပိုက်ကောင်များသည် ပျံသန်းနိုင်ကြပါသည်။\n\nသားပိုက်ကောင်များသည် သူတို့၏ကလေးများကို ဗိုက်အိတ်ထဲတွင်သယ်ဆောင်ကြသည်။\n\nသားပိုက်ကောင်များသည် အသားစားကြသည်။"],"g5I2_options":["ကစားသည်။\nကစားခဲ့သည်။\nကစားနေသည်။","သွားသည်။\nသွားခဲ့သည်။\nသွားနေသည်။","အော်သည်။\nအော်ခဲ့သည်။\nအော်နေသည်။","စားသည်။\nစားခဲ့သည်။\nစားနေသည်။"],"ng4I1_question":["စာပို့ဝန်ထမ်းတစ်ဦးတွင် ရုံးသုံးပစ္စည်းထည့်ထားသော ဘူး ၄ ဘူးရှိပြီး တစ်ဘူးစီတွင် ခဲတံ ၃၆ ချောင်းစီ ပါဝင်သည်။ ထိုခဲတံ ၁၄၄ ချောင်းကို ဝန်ထမ်း ၉ ဦးထံ အညီအမျှ ခွဲဝေပေးမည်ဆိုပါက ဝန်ထမ်းတစ်ဦးလျှင် ခဲတံမည်မျှရရှိမည်နည်း။","ဆိုင်တစ်ဆိုင်တွင် ကိတ်မုန့်များကို တစ်ဘူးလျှင် ၁၅ လုံးစီ ထည့်၍ ရောင်းချသည်။ ဝယ်သူတစ်ဦးက ၈ ဘူး ဝယ်ယူခဲ့သည်။ ဝယ်သူသည်စုစုပေါင်း ကိတ်မုန့်အရေအတွက် မည်မျှဝယ်ယူခဲ့သနည်း။","ဆိုင်တစ်ဆိုင်တွင် စာအုပ်များကို အုပ် ၁၈ အုပ်စီ ကို တထုတ်နှုန်းဖြင့်ရောင်းချသည်။ ဝယ်သူတစ်ဦးက အထုတ်ရေ ၁၂ ထုတ်ဝယ်ယူခဲ့သည်။ ထိုဝယ်သူသည် စုစုပေါင်း စာအုပ်မည်မျှ ဝယ်ယူခဲ့သနည်း။","မုန့်ဖုတ်ဆိုင်တစ်ဆိုင်သည် ဒိုးနပ်များကို ၁ ဘူးလျှင် ၁၂ လုံးထည့် ရောင်းချသည်။ ဝယ်သူတစ်ဦးသည် ၉ ဘူး ဝယ်ယူခဲ့သည်။ ဝယ်သူတွင် စုစုပေါင်း ဒိုးနပ်မည်မျှဝယ်ယူခဲ့သနည်း။"],"ng4I1_answer":["၁၆","၁၂၀","၂၁၆","၁၀၈"],"ng4I2_question":["ခြင်းတောင်းတစ်ခုထဲတွင် ပန်းသီး ၇၂ လုံးရှိပါသည်။ ထိုပန်းသီးများကို အတန်း ၆ တန်းကို အညီအမျှ ခွဲပေးလိုက်သည်။ အတန်းတစ်တန်းစီ တွင် ပန်းသီး မည် h  kal tthan a hauh tikah, Min Min nih fek tein a kuh i, \"Rak tlung colh!\" a ti."],"sentence_1":["Nandar cu saram a dawt tuk caah saram zohkhenhnak dun ah a kal.","Hla Hla cu cauk rel a huam tuk caah Cauk chiahnak inn ah a kal.","Sai cu a leng ah lentecelh a duh caah park ah a kal.","Maung cu tilio a huam tuk caah tiva ah a kalmi a si.","Kyaw cu thingthei cawk a duh caah market ah a kal."],"question_1":["Nandar cu khuazei ah dah a kal?",null,"Sai cu khuazei ah dah a kal?","Mang cu khuazei ah dah a kal?","Kyaw cu khuazei ah dah a kal?"],"answer_1":["Saram zohkhenhnak dum ah","Cauk chiahnak inn ah","Park ah","Tiva lei ah","Market ah"],"sentence_2":["Naing cu a hawile he park ah lente an i celh.","Khin Khin cu a dam lo caah siizung ah a kal.","Hla Hla cu cauk rel a duh tuk caah Cauk chiahnak inn ah a kal.","Aung Aung cu art a uar tuk caah museum ah a kal.","Thant cu thlacam a duh caah biakinn ah a kal."],"question_2":["Naing cu khuazei ah dah lente a celh?","Khin Khin khuazei ah dah a kal?","Hla Hla cu khuazei ah dah a kal?","Aung Aung cu khuazei ah dah a kal?","Thant cu khuazei ah dah a kal?"],"answer_2":["Park chungah","Siizung ah","Cauk chiahnak inn ah","Museum ah","Biakinn ah"],"tc_text_1":["Champo cu dawr lei ah a kal. A nu nih changreu va cawk ding a fial. Champo cu a nu bawmh khawhnak a hmuh caah a lung a tho tuk. Champo nih lam cung ih khur kha a hmuh lo ih a tengh. Aw! Champo cu a ke a fak tuk cang.","May cu cauk dawr ah a kal. A saya nih cauk thar a cawkter. May cu a saya bawmh dingah a lawm. Sihmanhsehlaw, a rual lomi lamkam kha a hmu lo i a tengh. Aw! A tu cu May a ke a fak tuk cang.","Htet Htet cu park lei ah a kal. A naunu nih ball lak dingin a hal. Htet Htet cu a naunu bawmh ding ah a lung a tho ngai. Sihmanhsehlaw, vawlei ah a tlami thingnge kha a hmu lo i a tengh. Aw! Atu cu Htet Htet a ke a fak tuk cang.","Nay Nay cu Biakinn lei ah a kal. A pi nih rimhmuifung khangh dingin a fial. Nay Nay cu lunglawm tein a pi a bawmh. Sihmanhsehlaw, a kalnak lam ih lung cu a hmu lo i a tengh. Aw! A tu cu Nay Nay a ke a fak tuk cang.","Thura cu tiva lei ah a kal. A pa nih ti khai dingin a fial. Thura cu a pa bawmh khawh caah a lawm. Sihmanhsehlaw, thinghram a chuahmi kha a hmu lo i a tengh. Aw! Thura a ke a fak tuk cang."],"tc_q1":["1) Zeiruangahdah Champo cu dawr ah a kal?","1) Zeiruangahdah May cu cauk dawr ah a kal?","1) Zeiruangahdah Htet Htet cu park ah a kal?","1) Nay Nay pi nih biakinn ah zei tuah dah a fial?","1) Zeiruangahdah Thura cu tiva ah a kal?"],"tc_a1":["A phi hman: Changreu cawk awkah","A phi hman: Cauk thar cawk awkah","A phi hman: Bawlung hmuh awkah","A phi hman: Zihmui fung khangh awkah","A phi hman: Ti ngahnak ding caah"],"tc_q2":["2) Zeiruangahdah Champo ke cu a fak?","2) Zeiruangahdah May ke cu a naa?","2) Zeiruangahdah Htet Htet ke cu a fak?","2) Zeiruangahdah Nay Nay ke cu a fak?","2) Zeiruangahdah Thura ke cu a fak?"],"tc_a2":["A phi hman: A tengh","A phi hman: A tengh","A phi hman: A tengh","A phi hman: A tengh","A phi hman: A tengh"],"tc_text_2":["Yangon ah Zatlangbu Cauk Chiahnak Inn Thar Puai Onnak\n\nA luan ciami zarh donghni ah khan Yangon nih an zatlangbu cauk chiahnak inn thar onnak puai an tuah. A ttha bikmi thilri he cawnnak le zatlangbu cawlcanghnak caah hmunpi a si lai tiah bia a kamh. Cauk chiahnak inn cu cauk tampi a khonmi, digital thilri, cun cawnnak le dinhnak hmun a si.\n\nKhuapi nih cauk zuarnak puai, ca rel zuamnak, le caṭialtu he i tonnak le donnak tibantuk puai phunphun tuah a timh. Hi saknak hi UNICEF nih khuami hna he i bawm in phaisa an bawmh mi a si. Cauk chiahnak inn nih kum upa le ngakchia hna lakah rel duhnak le cawn duhnak ngeihter aa tinh.",null,"Thayet Khua Nih Ti Pump Thar An Ngah ih Hlawknak an Hmuh\n\nThayet khuate nih ti pump thar bunhnak thawngin ti peknak ah tthanchonak tampi a hmuh. Hi tthanchonak nih hin a thiang le zumhawktlak mi ti a pek hna lai tiah bia a kamh hna, a hlan ah ti khai ding ah lam hlapi a kal a haumi khuami hna cungah thilrit a zorter.\n\nKhuachung sianginn saya Ko Aung Myo nih a chimmi cu, hi pump thar nih hin siangngakchia hna nih ti thiang an hmuh khawh cang caah an dam lonak ni a zorter. Pump thar pahnih chiahnak cu ramkip bawmhnak bu hna nih phaisa an bawmhmi a kau deuhmi timhtuahnak ah a telmi a si.","Kyun Taw Khuate ah Ngandamnak Sii Zung Thar An On\n\nKyun Taw khua ah ngandamnak siizung thar onnak nih zatlangbu ngandamnak zohkhenhnak tuahpiaknak ah a biapi tukmi karhlan a langhter. Sizung cu khuami hna caah khamnak sii, nu le ngakchia ngandamnak tuahpiaknak, cun a tlangpi in sii lei zohkhenhnak pek khawhnak ding caah thilri an ngei.\n\nHi siizung cu UNICEF le khuachung zatlangbu nih phaisa an thawh, ngandamnak tthanchonak caah hlawhtlinnak a hmumi riantuan ttinak a langhter. Khuami hna nih siizung nih khuami sii lei herhmi a tawlrel lai i kham khawhmi zawtnak a zorter lai tiah ruahchannak an ngei.","Hmawbi Khua Nih Sianginn Thar  An Cohlan\"\n\nKan hnu zarh chung ah Hmawbi Khua nih sianginn thar onnak puai an tuah. Cawnnak khaan panga a telmi hi fimcawnnak hmun nih khuate le pawngkam area ngakchia hna caah fimcawnnak ttha pek ding kha tinhmi a si.\n\nKhuami nulepa Ko Min Zaw nih a lunglawmhnak a langhter, sianginn nih a fale pahnih le zatlangbu tampi caah rian a ttuan lai. Sianginn saknak cu cozah phaisa le zatlangbu riantuannak fonh in thawh a si, khuate ngakchia hna hmailei caah biakamnak a langhter."],"tc_q3":["Cauk chiahnak inn thar ah khuapi nih tuah a timhmi puai chim.","Khuami hna caah zan ah lam kalnak a fawiter ih a him ter deuhmi cu zeidah a si?","Ti pump thar kong he pehtlai in khuachung sianginn saya, Ko Aung Myo nih zeidah a chim?","Kyun Taw khua ih ngandamnak siizung thar nih a pekmi tuanpiaknak pakhat kha chim.","Sianginn thar ah sianginn khaan zeizat dah a um?"],"tc_a3":["A si khomi aphi:\n- Cauk zuarnak puai\n- Ca rel zuamnak\n- Catialtu he tonnak le donnak caan hna","A hman mi aphi: Lammei hna bunhnak","A hman mi aphi:: Zawtnak ni azat a zorter","A si khomi aphi:\n- Vaccine chunhnak\n- Nu le ngakchia ngandamnak lei tuahpiaknak hna\n- A tlangpi in sii lei zohkhenhnak","A dikmi lehnak: Sianginn khaan 5"],"tc_q4":["Cauk chiahnak innpi saknak dingah aho nih dah phaisa a bawmh?","Nyaung khua ah solar panel pheng rak i ken ding ah thla zeizat dah timhtuahnak an rak ngei?","Pump thar zeizat dah an bunh cang?","Ngandamnak siizung saknak dingah aho nih dah phaisa a bawmh?","Nu le pa a si mi, Ko Min Zaw nih fate zeizat dah a ngeih?"],"tc_a4":["A phi hman: UNICEF le khuachung ummi hna","A phi hman: thla 5","A phi hman: pump 2","A phi hman: UNICEF le khuachung zatlangbu","A phi hman: gnakchia 2"],"sd_add":[null,null,null,null,null],"sd_add_ans":[null,null,null,null,null],"dd_add":[null,null,null,null,null],"dd_add_ans":["႑.  ႓႖\n႒.  ႔ ႗","႑.  ႔႖\n႒.  ႔႕","႑.  ႔႓\n႒.  ႘႕","႑.  ႖႙\n႒.  ႖႓","႑.   ႗႑\n႒.  ႖႒"],"sd_sub":[null,null,null,null,null],"sd_sub_ans":[null,null,null,null,null],"dd_sub":[null,null,null,null,null],"dd_sub_ans":[null,null,null,null,null],"sd_mul":[null,null,null,null,null],"sd_mul_ans":[null,null,null,null,null],"dd_mul":[null,null,null,null,null],"dd_mul_ans":[null,null,null,null,null],"sd_div":[null,null,null,null,null],"sd_div_ans":[null,null,null,null,null],"dd_div":[null,null,null,null,null],"dd_div_ans":[null,null,null,null,null],"g5I1_passage":["Catlang bu hi rel:\nGiraffe cu vawlei cung ah a sang bik mi saram a si. Hngawng sau pi a ngei, cu nih cun thingkung sang hna cung i hnah tiang a phanh khawhnak dingah a bawmh. Giraffes cu Africa ah an um i thingram an ei.","Catlang bu hi rel:\nWhale pawl cu rilipi chung ah a ngan bik mi saram an si. Abu in an um i aw hmangin pehtlaihnak an tuah. Whale tam deuh cu nga hmete te  le plankton nga pawl kha an ei hna.","Penguin cu a zuang kho lomi vate an si. A kiknak hmun ah an um i nga tlaih awkah rilipi chung ah ti an i lio. Penguin pawl cu vawlei ah cun cei nawn pi pi in an kal I  ti lio thiam takmi an si.","Kangaroo cu an hnu lei ke tha thawng i per le hlawh buin a kal mi saram an si. An fale cu an paw  zal chungah an chiah hna I an phorh hna. An nih cu Australia ram ah an um. Kangaroo nih ramhring le a dang thingram hna an ei."],"g5I1_question":["Catlang bu i a biapi bikmi kong cu zeidah a si?","Catlang bu i a biapi bikmi kong cu zeidah a si?","Catlang bu i a biapi bikmi kong cu zeidah a si?","Catlang bu i a biapi bikmi kong cu zeidah a si?"],"g5I1_answer":["Giraffe hna cu a sang bik mi saram an si.","Whale hna cu rilipi chung ah a ngan bikmi saram an si.","Penguin pawl cu ti lio thiam tak mi an si i a kiknak hmun ah an um.","Kangaroo pawl cu an fale kha an paw  zal chungah an chiah hna I an phorh hna."],"g5I2_passage":["Catlang: Ka nau nih Zarhpi ni fatin bawlung a ____.","Catlang: Mah nu cu nifatin bus in sianginn ah a ____.","Uico cu zan ah fakpi in a ____.","Chun ah chuncaw kan ____."],"g5I2_question":["Catlang a tling khawhnak ding caah a dikmi verb kha thim:","Catlang a tling khawhnak ding caah a dikmi verb kha thim:","Catlang a tling khawhnak ding caah a dikmi verb kha thim:","Catlang a tling khawhnak ding caah a dikmi verb kha thim:"],"g5I2_answer":["chuih","kal","bo","ei"],"g6I1_passage":["Fatima cu a camipuai caah zaan fatin ca a zoh. Zingka tuan te ah a tho i ca a tuah cun cazin nekcok pawl a tuah. Aa fian lo mi a um tikah a saya kha bawmh a hal zungzal. A tha a ba ko nain teinak hmuh a duh caah peh zulh tein aa zuam peng. Camipuai a phit ni ah cun a mah le amah a zumh ngai ziahticun ttha tein aa timhtuah cia i a si.","Alex cu a zarh donghni hna cu thingkung cung inn saknak ah  caan a hman.Alex cu inn sak dan Video hna a zoh, lamhmuhsaknak ca hna a rel, cun ruahnak a hal. Palhnak a tuah sual zongah, a lung a dong lo. Zarh tampi hnu ah, thingkung cung inn cu a lim.","Tara cu a sianginn kai hawi pawl kha math buainak pawl hngalhthiam khawhnak caah a bawmh hna. Lungsau tein a chimh hna I mizapi i tel kho ding zong in tha tein a chimh hna. A sianginn kai hawi hna zong nih a bawmh nak hna cung khan an i lawm i a mah cu an upat.","Sophie cu sianginn i pahrang piahnak puai ah piah ve ding ah a thin a phang. Zarh tampi chung a rak cawng lengmang, natein a mah caan a phak tikah a kut a ther. Music aa thawk tikah,a thaw pi a chuah i aa biatak.Music a tum pah in a thinphan nak cu a zor i a piah mi a vun dih tik ah cun a ttihnak lungthin kha a pah chih khawh caah amah le amah aa porhlaw."],"g6I1_question":["Fatima nih a tonmi harnak pawl kha zeitindah lehnak a tuah, cun mah cu tuanbia biakhiahnak ah zeitindah a tel?","Alex nih thingkung cung inn saknak ah harnak a tonmi kha zeitindah lehnak a tuah, cun zeidah a phichuak a si?","Tara nih a sianginn kai hawi hna nih an tonmi dirhmuh kha zeitindah lehnak a tuah, cun mah cu tuanbia biakhiahnak ah zeitindah a tel?","Sophie nih a thinphannak kha zeitindah lehnak a tuah, cun a tuahsernak nih zeidah a chuahpi?"],"g6I1_options":["Fatima cu cawng a hrial, a phichuak cu camipuai a sungh.\nFatima cu a har mi thil a ton tikah a lung a dong i a tthancho lo.\nFatima cu aa zuam I a herh caan poh ah saya sin ah bawmh a hal caah caminpuai ni ah a mah le amah zumh nak a ngei.\nFatima cu dinh caan lak loin a cawng i camipuai ni ah a tha a dih.","Alex nih thingkung cung inn cu bawmhnak tel loin a sak ih palhnak tampi a tuah ih cu nih cun a riantuan awk  a chiatter.\nAlex nih thingkung cung inn cu a thawk, sihmansehlaw a har ti a theih tikah a ngol.\nAlex cu a palhnak ruangah a lung a dong i a riantuan awk cu a hlawt.\nAlex cu palhnak a um ko nain a zuam tento i a donghnak ah thingkung cung tlamtling tein a sak khawh.","Tara cu a sianginn kai hawi hna cungah a lung a dong i thil fianternak a ngol.\nTara nih a sianginn kai hawi hna kha zei ah a rel hna lo i math zong a bawm hna lo.\nTara nih a sianginn kai hawi pawl kha lungsau tein thil fianternak in a bawmh hna, mah nih upatnak a hmuhter.\nTara nih bawmh  ding in aa zuam, natein a sianginn kai hawi hna nih an lawmh lo.\"","Sophie nih tuahsernak a tuah lio ah a hlabia pawl kha a philh i a lung a rawk.\nSophie nih a thinphannak lungthin kha a pah chih i, a donghnak ah, a tuahsernak cungah amah le amah a porhlaw.\nSophie cu tuahsernak tuah ding ah a thin a phang tuk i stage cu a kaltak.\nSophie cu a thinphannak nih a tuahsernak a ukter, cu nih cun chiatnak a chuahter."],"g6I1_answer":["Fatima cu aa zuam I a herh caan poh ah saya sin ah bawmh a hal caah caminpuai ni ah a mah le amah zumh nak a ngei.","Alex cu palhnak a um ko nain a zuam tento i a donghnak ah thingkung cung tlamtling tein a sak khawh.",null,"Sophie nih a thinphannak lungthin kha a pah chih i, a donghnak ah, a tuahsernak cungah amah le amah a porhlaw."],"g6I2_question":["A tanglei cawlcangnak pawl lakah zei nih dah hmuhtonnak pakhatkhat a nekcok tiangin langhternak caah theihhngalhnak konglam asiloah a dikthliar in holh a hman? (A tlakmi vialte kha thim)","A tanglei cawlcangnak pawl lakah zei nih dah hmuhtonnak pakhatkhat a nekcok tiangin langhternak caah theihhngalhnak konglam asiloah a dikthliar in holh a hman? (A tlakmi vialte kha thim)","A tanglei cawlcangnak pawl lakah zei nih dah hmuhtonnak pakhatkhat a nekcok tiangin langhternak caah theihhngalhnak konglam asiloah a dikthliar in holh a hman? (A tlakmi vialte kha thim)","A tanglei cawlcangnak pawl lakah zei nih dah hmuhtonnak pakhatkhat a nekcok tiangin langhternak caah theihhngalhnak konglam asiloah a dikthliar in holh a hman? (A tlakmi vialte kha thim)"],"g6I2_options":["Sianginn tual thianhnak tuah ding ah mah lungtho tein riantuan, thil vialte kha ttha tein tawlrel hna\nNawlngeihnak um loin rawl dang i lak\nRawl a tammi sianginn kai hawi hna he rawl i hrawm ttinak in an mithmai a panhmi zoh\nTaang no Sianghngakchia i a biahalnak kha ttha tein ngaihpiak law an homework kha bawmh\nBawmh a herhmi hawi kha zeirel loin um\nTar mi pakhat caah na baan in eidin awk thilri phorh","Dornak hmun ah thilthuam pek le thilthuam a lumnak kong chim\nZeltuang ah hmunthur hlawnh\nA tlami kha nihsawh\nMidang homework kha chawn ve\nNa titsa hna a rengh lio ah cauk rit phorh bawmh\nA tlaumi k ၢႆးမၼ်းဝႃႈ ပွၵ်ႈမႃးဝႆးဝႆးလႄႈၼႃႈ။","ထႅတ်ႉယူႇၸွမ်းပူႇၼၢႆးမၼ်းၼၢင်းတီႈဝဵင်းဢွၼ်ႇဝဵင်းၼိုင်ႈ။ ၵျေႃႇ​​ၵေႃႉပဵၼ်ပီးၸၢႆးၶႅၼ်ႈတွင်ႉ​​တေႉၶိုၼ်ႈၸၼ်ႉၸွမ်ယူႇတီႈၼႂ်းဝဵင်းလူင်ယူႇယဝ်ႉ။ မိူဝ်ႈ​​ၵျေႃႇပွၵ်ႈမႃးလႄႇတီႈႁိူၼ်း ထႅတ်ႉ​​ၵေႃႈမီးတၢင်းသိူဝ်းၸႂ်လႄႈတိုၼ်ႇတဵၼ်ႈၼႃႇ။ ၶဝ်သွင်​​ၵေႃႉ​​ၵေႃႈလဵၼ်းၵဵမ်းၸွမ်းၵၼ်​​သေ ၵိၼ်ၶဝ်ႈၼမ်ႉတၢင်းၵိၼ် ဢၼ်ပူႇၼၢႆးၶဝ်ႁၢင်ႈႁႅၼ်းပၼ်​​ၼၼ်ႉသေလႆႈၸႂ်ႉၶၢဝ်းယၢမ်းၸွမ်းၵၼ်ၵႂႃႇယူႇယဝ်ႉ။ မိူဝ်ႈထိုင်ၶၢဝ်းယၢမ်း​​ၵျေႃႇ​​တေလႆႈၵႂႃႇသိုပ်ႇႁဵၼ်းတီၸၼ်ႉၸွမ်ၼၼ်ႉ ​​ၵျေႃႇ​​ၵေႃႈလႆႈသူင်ႇသင်ႇမႃႇလႃႇယူႇယဝ်ႉ။","​​သေႃးရႃႇယူႇၸွမ်း​​ပေႃႈမႄႈမၼ်းၼၢင်းတီႈဝဵင်းဢွၼ်ႇဝဵင်းၼိုင်ႈယဝ်ႉ။ မီႇရႃႇ​​ၵေႃႉပဵၼ်ပီႈၼၢင်း​​သေႃးရႃႇ​​တေႉယူႇၼႂ်းဝဵင်းလူင်တွၼ်ႈတႃႇၶိုၼ်ႈႁဵၼ်းၸၼ်ႉၸွမ်။ ၽွင်းယၢမ်းမီႇရႃႇပွၵ်ႈမႃးလႄႇတီႈႁိူၼ်း ​​သေႃးရႃႇ​​ၵေႃႈမီးတၢင်းသိူဝ်းၸႂ်ၼႃႇ။ ၶဝ်သွင်​​ၵေႃႉ​​ၵေႃႈလဵၼ်းၵဵမ်းၸွမ်းၵၼ်​​သေ ၵိၼ်ၶဝ်ႈၼမ်ႉတၢင်းၵိၼ်ဝၢၼ်ဝၢၼ်တီႈဢၼ်မႄႈၶဝ်ႁၢင်ႈႁဵၼ်းပၼ်ဝႆႉၼၼ်ႉယူႇယဝ်ႉ။ မိူဝ်ႈမီႇရႃႇ​​တေလႆႈပွၵ်ႈမိူဝ်းၶိုၼ်ႈႁဵၼ်းတီႈၸၼ်ႉၸွမ်ၼၼ်ႉ ​​သေႃးရႃႇလၢတ်ႈမီႇရႃႇဝႃႈ ၶိုၼ်းမႃးဝႆးဝႆးၼႃႇ ၼႆယဝ်ႉ။","သီႇတႃႇယူႇၸွမ်းလုင်းလႄႈပႃႈမၼ်းၼၢင်းတီႈၼႂ်းမူႇဝၢၼ်ႈလဵၵ်ႉလဵၵ်ႉဢွၼ်ဝၢၼ်ႈၼိုင်ႈ။ ထႅတ်ႉ​​ၵေႃႉပဵၼ်ပီႈၼၢင်းၶႅၼ်ႈတွင်ႉမၼ်းၼၢင်း​​ၵေႃႈၶိုၼ်ႈၸၼ်ႉၸွမ်ၼႂ်းဝဵင်းလူင်ယူႇယဝ်ႉ။ ၽွင်းယၢမ်းထႅတ်ႉပွၵ်ႈမႃးလႄႇတီႈႁိူၼ်း ​​သီႇတႃႇ​​ၵေႃႈမီးတၢင်းသိူဝ်းၸႂ်ၼႃႇ။ၶဝ်သွင်​​ၵေႃႉ​​ၵေႃႈလဵၼ်းၵဵမ်းၸွမ်းၵၼ်​​သေ ၵိၼ်ၶဝ်ႈၼမ်ႉတၢင်းၵိၼ်တီႈဢၼ်ပႃႈၶဝ်ႁၢင်ႈႁႅၼ်းပၼ်ဝႆႉယူႇယဝ်ႉ။ မိူဝ်ႈထႅတ်ႉ​​တေႇလႆႈပွၵ်ႈၶိုၼ်းမိူဝ်းၶိုၼ်ႈႁဵၼ်းတီႈၸၼ်ႉၸွမ်ၼၼ်ႉ သီတႃႇၵွတ်ႇထႅတ်ႉ​​သေလၢတ်ႈဝႃႈ ပွၵ်ႈမႃးဝႆးဝႆးၼႃ ၼႆယဝ်ႉ။","မီၼ်းမိၼ်းယူႇၸွမ်း​​ပေႃႈမႄႈၶဝ်တီႈမူႇဝၢၼ်ႈဢွၼ်ႇဝၢၼ်ႈၼိုင်ႈ။ ၵျေႃႇ​​ၵေႃႉပဵၼ်ပီႈၸၢႆးမၼ်း​​တေႉလႆႈၵႂႃႇႁဵတ်းၵၢၼ်တီႈဝဵင်းလူင်ယူႇယဝ်ႉ။  ၽွင်းယၢမ်း​​ၵျေႃႇပွၵ်ႈမႃးလႄႇတီႈႁိူၼ်း ​​မိၼ်းမိၼ်းၵေႃႈမီးတၢင်းသိူဝ်းၸႂ်ၼႃႇ။ၶဝ်သွင်​​ၵေႃႉ​​ၵေႃႈလဵၼ်းၵဵမ်းၸွမ်းၵၼ် ၶႆႈဢပုမ်ႇၵၼ် ​​သေၵိၼ်ၶဝ်ႈၼမ်ႉတၢင်းၵိၼ်ဝၢၼ်ဝၢၼ်တီႈဢၼ်​​ပေႃႈမႄႈၶဝ်ႁၢင်ႈႁႅၼ်းပၼ်ဝႆႉယူႇယဝ်ႉ။မိူဝ်ႈ​​ၵျေႃႇ​​တေလႆႈပွၵ်ႈၶိုၼ်းမိူဝ်းႁဵတ်းၵၢၼ်တီႈၼႂ်းဝဵင်းလူင်ၼၼ်ႉ  မိၼ်းမိၼ်းၵွတ်ႇ​​ၵျေႃႇ​​သေလၢတ်ႈဝႃႈ ပွၵ်ႈမႃးဝႆးဝႆးၼႃ ၼႆယဝ်ႉ။"],"sentence_1":["ၼၼ်ႇတႃႇထုၵ်ႇၸႂ်တူဝ်သတ်းၼႃႈလႄႈမၼ်းၼၢင်းၸိုင်ၵႂႃႉသူၼ်သတ်း","လႃႉလႃႉသူင်ၸႂ်လူႇလိၵ်ႈလႄႈမၼ်းၼၢင်ႈၸိုင်ၵႂႃႇလူႇလိၵ်ႈတီႈႁူင်းတူၺ်းလိၵ်ႈ","ၸၢႆးထုၵ်ႇၸႂ်လဵၼ်ႈၼွၵ်ႇတူင်ႇဝိူင်း လႄႈမၼ်းၸၢႆးၸိုင်ၵႂႃႇလဵၼ်ႈတီႈသူၼ်သိူဝ်း;","မွင်ႇထုၵ်ႇၸႂ်လွင်ႈလုၺ်းၼမ်ႉ ​​လေႈမၼ်းၸၢႆးၸိုင်ၵႂႃႇတီႈတႃႈၼမ်ႉ","​​ၵျေႃႇဢွၵ်ႇၸႂ်ၶႂ်ႈသိုဝ်ႉမၢၵ်ႇမႆႉ လႄႈမၼ်းၸၢး​​ၵေႃႈၵႂႃႇတီႈၵၢတ်ႇယူယဝ်ႉ။"],"question_1":["ၼၼ်ႇတႃႇၵႂႃႇတီႈလႂ်?","လႃႉလႃႉၵႂႃႇတီႈလႂ်?","ၸၢႆးၵႂႃႇတီႈလႂ်?","မွင်ႇၵႂႃႈတီႈလႂ်","​​ၵျေႃႇၵႂႃႇတီႈလႂ်?"],"answer_1":["သူၼ်သတ်း","ႁူင်းတူၺ်းလိၵ်ႈ","သူၼ်သိူဝ်း","တႃႈၼမ်ႉ","ၵၢတ်ႇ"],"sentence_2":["ၼႅင်ႇလဵၼ်ႈၸွမ်းတႆး​​ၵေႃႉမၼ်းၸၢႆးၼႂ်းသူၼ်သိူဝ်း","ၶိၼ်ႇၶိၼ်ႇဢမ်ႇယူလီလႄႈၵႂႃႇႁူင်းယႃ","လႃႉလႃႉသူင်ၸႂ်လူႇလိၵ်ႈလႄႈမၼ်းၼၢင်ႈၸိုင်ၵႂႃႇလူႇလိၵ်ႈတီႈႁူင်းတူၺ်းလိၵ်ႈ","ဢွင်ႇဢွင်ႇသူင်ၸႂ်ပၢႆးမွၼ်းလႄႈၵႂႃႇႁွင်ႈ​​ၼေၶူင်းၶွင်ၵဝ်ႇ","တၢၼ်ႇထုၵ်ႇၸႂ်ၵႂႃႇဝႆႈၽြႃႈတီႈဝတ်ႉ"],"question_2":["ၼႅင်ႇလဵၼ်ႈယူႇတီႈလႂ်?","ၶိၼ်ႇၶိၼ်ႇၵႂႃႇတီႈလႂ်","လႃႉလႃႉၵႂႃႇတီႈလႂ်?","ဢွၵ်ႇဢွင်ႇၵႂႃႇတီႈလႂ်?","တၢၼ်ႇၵႂႃႇတီႈလႂ်?"],"answer_2":["ၼႂ်းသူၼ်သိူဝ်း","ႁူင်းယႃ","ႁူင်းတူၺ်းလိၵ်ႈ","ႁွင်ႈ​​ၼေၶူဝ်းၶွင်ၵဝ်ႇ","ဝတ်ႉ"],"tc_text_1":["ၶျၢမ်းပူဝ်ႇပႆၵႂႃႇတီႈလၢၼ်ႉၶၢႆၶဝ်ႈမုၼ်း။ မႄႈမၼ်းၸၢႆးႁႂ်ႈမၼ်းသိုဝ်ႉၶဝ်ႈမုၼ်း။ၶျၢမ်းပူဝ်ႇမီးတၢင်းသိူဝ်းတီႈလႆႈၸွၺ်ႈမႄႈမၼ်းၸၢႆး။ ၶျၢမ်းပူဝ်ႇဢမ်ႇႁၼ်ဝႃႈသဵၼ်ႈတၢင်းတီႈဢၼ်မၼ်းၸၢႆးပႆႇယူႇၼႆႉမီးလုၵ်းႁွင်ႈ ၽွင်းမၼ်းၸၢႆးပႆႇယူႇၼၼ်ႉမၼ်းၸၢႆးလူမ်ႉ​​သေဢဝ်တိၼ်မၼ်းၸၢႆး​​တူၵ်းၶမ်ယူႇၼႆးလုၵ်းႁွင်ႈၼၼ်ႉယဝ်ႉ။ ဢႃႉ! မိူဝ်ႈလဵဝ်တိၼ်ၶွင်ၶျၢမ်းပူဝ်ႇ​​ၵေႃႈလႆႈၸဵပ်းႁႅင်းယဝ်ႉ","​​မေႇပႆႇၵႂႃႇတီႈလၢၼ်ႉၶၢႆပပ်ႉ။ ​​မေႃသွၼ်မၼ်းၼၢင်းႁႂ်ႈမၼ်းသိုဝ်ႉပပ်ႉမႂ်ႇမႃးၼိုင်ႈပပ်ႉ။ မၼ်းၼၢင်းမီးတၢင်းသိူဝ်းတီႈလႆႈၸွၺ်ႈ​​မေႃသွၼ်မၼ်းၼၢင်း။ ၵူၺ်းၼႃႇမိူဝ်ႈမၼ်းၼၢင်းပႆႇယူႇၼၼ်ႉ မၼ်းဢမ်ႇလႆႈၾၢင်ႉသတိဝႃႈသဵၼ်ႈတၢင်းၼႆႉမၼ်းၵူတ်ႉလႄႈဢမ်ႇလီ မၼ်းၼၢင်းၸိုင်ၶွင်ႈလူမ်ႉသေယဝ်ႉ။ ဢႃႉ! တိၼ်ၶွင်​​မေႇ​​ၵေႃႈလႆႈၸဵပ်းႁႅင်းဝႆႉယူႇယဝ်ႉ။","ထႅၵ်ႉထႅၵ်ႉပႆႇၵႂႃႇတီႈသူၼ်သိူဝ်း။ ပီႈသၢဝ်မၼ်းၼၢင်းႁႂ်ႈမၼ်းဢဝ်မၢၵ်ႇၼင် မၼ်းၼၢင်းမီးတၢင်းသိူဝ်း တီႈလႆႈၸွၺ်ႈပီႈသၢဝ်မၼ်းၼၢင်း။ ၵူၺ်းၼႃႇဝႃႈမၼ်းၼၢင်းဢမ်လႆႈၾၢၵ်ႉသတိဝႆႉဝႃႈ ၵိုင်ႇမႆႉ​​တေတူၵ်းလူင်းမႃးၼိူဝ်လိၼ် မၼ်းၼၢင်းၸိုင်ၶွင်ႈလူမ်ႉၵႂႃႇယူႇယဝ်ႉ။ဢႃႉ! မိူဝ်လဵဝ်တိၼ်မၼ်းၼၢင်း​​ၵေႃႈလႆၸဵပ်းႁႅင်းယူႇယဝ်ႉ။","​​ၼေႇ​​ၼေႇပႆၵႂႃႇတီႈဝတ်ႉၵျွင်း။ ၼၢႆးမၼ်းၼၢင်းႁႂ်ႈမၼ်းၸပ်းတဵၼ်းႁွမ်။. ၼေႇ​​ၼေႇမီးတၢင်းသိူဝ်းတီႈလႆႈၸွၺ်ႈၼၢႆးမၼ်းၼၢင်း။ၵူၺ်းၼႃႇမၼ်းၼၢင်းဢမ်ႇလႆႈၾၢင်ႉသတိဝႃႈတၢင်းသဵၼ်ႈၼႆႉမီးမၢၵ်ႇႁိၼ် မၼ်းၼၢင်း​​ၵေႃႈလႆႈယဵပ်ႇမၢၵ်ႇႁိၼ်ၼၼ်ႉ​​သေၶွင်ႈလူမ်ႉၵႂႃႇယူႇယဝ်ႉ။ဢႃႉ! တိၼ်ၶွင်​​ၼေႇ​​ၼေႇ​​ၵေႃႈလႆႈမၢတ်ႇၸဵပ်းယူႇယဝ်ႉ။","တူႇရပႆၵႂႃႇတီႈတႃႈၼမ်ႉ။​​ပေႃႈမၼ်းၸၢႆးႁႂ်ႈမၼ်းၵႂႃႇတဵၵ်းၼမ့်။မၼ်းၸၢႆးမီးတၢင်းသိူဝ်းတီႈလႆႈၸွၺ်ႈ​​ပေႃႈမၼ်း တႄႇဝႃႈမၼ်းၸၢႆးဢမ်ႇႁၼ်ၺႃးဝႃႈမီးႁၢၵ်ႇမႆႉငွၵ်ႈဢွၵ်ႇမႃးတီႈတူၼ်ႈမႆႉၼၼ်ႉ မၼ်းၸၢႆးၸိုင်ၶွင်ႈၺႃးႁၢၵ်ႈမႆႉၼၼ်ႉ​​သေလူမ်ႉၵႂႃႉယူႇယဝ်ႉ။ ဢႃႉ! တိၼ်ၶွင်တူႇရ​​ၵေႃႈလႆႈၸဵပ်းႁႅင်းယူႇယဝ်ႉ။"],"tc_q1":["1)ယွၼ်ႉသင်လႄႈၶျၢမ်းပူဝ်ႇၵႂႃႇတီႈလၢၼ်ႉၶဝ်ႈမုၼ်း?","1)​​ယွၼ်ႉသင်လႄႈမေႇၵႂႃႇတီႈလၢၼ်ႉပပ်ႉ?","1)ယွၼ်ႉသင်လႄႈထႅၵ်ႉထႅၵ်ႉၵႂႃႇသူၼ်သိူဝ်း?","1)ၼၢႆးၶွင်​​ၼေႇ​​ၼေႇႁႂ်ႈမၼ်းၼၢင်းႁဵတ်းသင်?","1) ယွၼ်ႉသင်တူႇရၸိုင်ၵႂႃႇတီႈတႃႈၼမ်ႉ?"],"tc_a1":["တွပ်ႇ- တွၼ်ႈတႃႇသိုဝ်ႉၶဝ်ႈမုၼ်း","တွပ်ႇ- တွၼ်ႈတႃႇၵႂႃႇသိုဝ်ႉပပ်ႉမႂ်ႇ","တွပ်ႇ- တွၼ်ႈတႃႇဢဝ်မၢၵ်ႇၼင်","တွပ်ႇ-ႁႂ်ႈမၼ်းၼၢင်းၸပ်းတဵၼ်းႁွမ်","တွပ်ႇ- တွၼ်ႈတႃႇတဵၵ်းၼမ်ႉ"],"tc_q2":["2)တိၼ်ၶွင်ၶျၢမ်းပူဝ်ႇလႆႈၸဵပ်းယွၼ်ႉသင်?","2)တိၼ်ၶွင်​​မေႇလႆႈၸဵပ်းယွၼ်ႉသင်?","2) တိၼ်ၶွင်ထႅၵ့်ထႅၵ်ႉၸဵပ်းယွၼ်ႉသင် ?","2)တိၼ်ၶွင်​​ၼေႇ​​ၼေႇလႆႈမၢတ်ႇၸဵပ်းယွၼ်ႉသင်?","2) တိၼ်ၶွင်တူႇရၸဵပ်းယွၼ်ႉသင် ?"],"tc_a2":["တွပ်ႇ-ၵွပ်ႈဝႃႈမၼ်းၸၢႆးလူမ်ႉ","တွပ်ႇ-ၵွပ်ႈဝႃႈမၼ်းၼၢင်းၶွင်ႈလူမ်ႉ","တွပ်ႇ-ၵွပ်ႈဝႃႈၶွင်ႈလူမ်ႉ","တွပ်ႇ- ၵွပ်ႈဝႃႈမၼ်းၼၢင်းယဵပ်ႇၺႃးမၢၵ်ႇႁိၼ်","တွပ်ႇ- ၵွပ်ႇဝႃႈၶွင်ႈလူမ်ႉ"],"tc_text_2":["ပၢင်ပွၺ်းပိုတ်ႇႁူင်းတူၺ်းလိၵ်ႈတွၼ်ႈတႃႇတူင်ႇၵူၼ်း တီႈဝဵင်းလူင်တႃႈၵုင်ႈ       \n                                                                                                                                                                                                                  မိူဝ်ႈပူၼ်ႉမႃးၼိုင်ႈဝူင်ႈၼၼ်ႉမီးၵၢၼ်ၸတ်းႁဵတ်းပၢင်ပွၺ်းပိုတ်ႇႁူင်းတူၺ်းလိၵ်ႈမႂ်ႇတွၼ်ႈတႃႇတူင်ၵူၼ်း တီႈဝဵင်းလူင်တႃႈၵုင်ႈ။ ၼႂ်းမိူဝ်းၼႃႈမႃးႁူင်း​​ႁေႃတီႈဢၼ်ၶိုတ်းၵၢပ်ႈၼႆႉတေပဵၼ်တီႈဢၼ်တူင်ႇၵူၼ်းႁဝ်းလႆႈလဵပ်ႈႁဵၼ်းႁုႉႁၼ်လွင်ႈမႂ်ႇမႂ်ႇလႄႈ​​တေပဵၼ်တီႈၵူၼ်းပိုၼ်ႉတီႈဝႆႉၼမ်ႉၼၵ်းတွၼ်ႈတႃႇႁဵတ်းလွင်ႈတူင်ႉၼိုင်ယဝ်ႉ။ ၼႂ်းႁူင်းတူၺ်းလိၵ်ႈၼႆႉ​​ တွၼ်ႈတႃပၢႆးလဵပ်ႈႁဵၼ်းၼႆၸိုင် ​​တေႉမီး ပပ်ႉလိၵ်ႈ မီးၶိူင်ႈၸႆႉတိုဝ်းတီႇၸီတႄႇၵူႈသႅၼ်းသႅၼ်း ၼွၵ်ႈလိူဝ်​​သေၼႆႉယင်းမီးတီႈလိုဝ်ႈသဝ်းဝႆႉပၼ်ယူႇယဝ်ႉ။ ၾၢႆႇၸိုင်ႈမိူင်းၶဝ်​​ၵေႃႈ​​ႁၢင်ႈႁႅၼ်းတေၸတ်းႁဵတ်းပၢင်ပွၺ်းၶၢႆပပ်ႉလိၵ်ႈ၊ပၢင်ပွၺ်း​​ၶေႇသဵင်လူႇဢၢၼ်ႇလိၵ်ႈ လႄႈ ပၢင်ပွၺ်းႁူပ်ႉထူပ်း​​မေႃတႅမ်ႈ။ႁူင်းတူၺ်းလိၵ်ႈၼႆႉပဵၼ်ႁူင်း​​ႁေႃတီႈဢၼ်ၸုမ်းယူႇၼီႇသတ်ႉ(UNICEF)လႄႈၵူၼ်းၼႂ်းပိုၼ်ႉတီႈႁူမ်ႈႁွမ်းၵၼ်​​သေ​​ၵေႃႇသၢင်ႈဝႆႇဝႃႈၼႆ။ ၵၢၼ်ပိုတ်ႇႁူင်းတူၺ်းလိၵ်ႈၼႆႉမီးယိူင်းဢၢၼ်းတွၼ်ႈတႃႇၵူၼ်းၸၼ်ႉထၢၼ်ၵူႊသႅၼ်းသႅၼ်းဢမ်ႇဝႃႈထဝ်ႈဝႃႈၼုမ်ႇ ႁႂ်ႈလႆႈမေႃႁၵ်ႉပႅင်းဝႆႉၼမ်ႉၼၵ်းၼိူဝ်ၵၢၼ်လူလိၵ်ႈ လႄႈ ၵၢၼ်လဵပ်ႈႁဵၼ်းလွင်ႈမႂ်ႇမႂ်ႇ။","ၾႆးၾႃႉသူဝ်ႇလႃႇၸွၺ်ႈဝၢၼ်ႈၺွင်ႇ​​ၵေးလႆႈလႅင်းတင်းဝၢၼ်ႈ။  \n\nမိူဝ်ႈဢမ်ႇပႆ​​ပေႃးႁိုင်ၼႆႉၵူၺ်း ဝၢၼ်ႈၺွင်ႇ​​ၵေးလႆႈတင်ႈၾႆးသူဝ်ႇလႃႇလႄႈမၼ်းၸွၺ်ႈႁႂ်းလႆႈလႅင်းတင်ဝၢၼ်ႈ လွင်ႈဢၼ်ၵူၼ်းၼႆႉဝၢၼ်ႈယိူင်းဢၢၼ်းဝႆႉ​​ၵေႃႈလႆႈပဵၼ်မႃး​​တေႉယဝ်ႉ။ လွင်ႈဢဝ်ၾႆးသူဝ်ႇလႃႇမႃးတင်ႈ​​ၵေႃႈ တွၼ်ႈတႃႇ​​တေပဵၼ်ၶိူင်ႈၸႂ်ႉၾႆးၾႃႉတီႈဢၼ်မူႇဝၢၼ်ႈယုမ်ႇယမ်လႄႈႁဵတ်းႁႂ်ႈလွင်ႈယူႇသဝ်းႁႃၵိၼ်ၶွင်ၵူၼ်းၼႂ်းဝၢၼ်ႈမီးလွင်ႈၶိုၼ်ႈယႂ်ႇ။\n\nလွင်ႈတင်ႈၾႆးၸွမ်းသဵၼ်ႈတၢင်း​​ၵေႃႈ ပဵၼ်တွၼ်ႈတႃႇၵူၼ်းၼႂ်းမူႇဝၢၼ်ႈ ၵႂႃႇပႆႇမႃးငၢႆႈ လႄႈ လွတ်​​ႈ​​ၽေးၶဵၼ် လွင်ႈၶိုင်သၢင်ႈၼႂ်းၵၢၼ်တင်ႈၾႆးသူဝ်ႇလႃႇႁႃႈလိူၼ်ၼႆႉ ပဵၼ်လူင်ပွင်ၸိုင်ႈလႄႈၽၢႆႇၵၢၼ်သုၼ်ႇတူဝ်လႆႈၵမ်ႉထႅမ်ၸွၺ်ႈဝႆႉယူႇယဝ်ႉ။ ၵူၼ်းၼႂ်းဝၢၼ်းမုင်ႈမွင်းဝႃႈ ၼႂ်းမိူဝ်းၼႃႈမႃး​​ၵေႃႈ​​တေမီးလွင်ႈၶိုတ်းၵၢပ်ႈၶိုၼ်ႈယႂ်ႇလိူဝ်​​သေၼႆႉ။","ၽွၼ်းလီၸၢၵ်ႈလုတ်ႇၼမ်ႉမႂ်ႇတီႈဝၢၼ်ႈတယတ်ႉ​​ၵျေး။\n\nလွင်ႈလႆႈတင်ႈၸၢၵ်ႈလုတ်ႇၼမ်ႉတီႈဝၢၼ်ႈတယတ်ႉၵျေးၼႆႉလႆႈႁၼ်ဝႃႈ ၵၢၼ်ဢၼ်တီႈပွၺ်ႇပၼ်ၼမ်ႉၼႆႉလႆႈၶိုပ်ႉၼႃႈမႃးႁႅင်း​​တေႉ​​တေႉ။ ၵၢၼ်ၶိုပ်ႉၼႃႈၼႆႉၸွၺ်ႈႁႂ်ႈၵူၼ်းဝၢၼ်ႈၼႂ်းမူႇဝၢၼ်ႈဢမ်ႇလူဝ်ႇသဵင်ႈၶၢဝ်းယၢမ်းတႃႇၵႂႃႇတဵၵ်းၼမ်ႉတီႈၵႆယဝ်ႉ လွင်ႈဢၼ်ၵမ်ႉထႅမ်တွၼ်ႈတႃႇ​​တေလႆႈၼမ်ႉၼႆႉ​​ၵေႃႈယုမ်ႇၸႂ်လႆႈဝႃႈတေလႆႈၼမ်ႉဢၼ်မူတ်းသႂ်။ \n\n​​မေႃသွၼ်ဢွင်ႉမျဵဝ်း​​ၵေႃႉပဵၼ်​​မေႃသွၼ်တီႈဝၢၼ်ႈၼႆႉလၢတ်ႈဝႃႈ ၵွပ်ႈမီးၸၢၵ်ႈလုတ်ႇၼမ်ႉၼႆႉ​​ၵေႃႈလႆႈၼမ်ႉမူတ်းသႂ်လႄႈၸွၺ်ႈလူတ်ႉလွင်ႈၶၢတ်ႇႁဵၼ်းၶွင်လုၵ်ႈႁဵၼ်းယူႇယဝ်ႉ။ လွင်ႈတင်ႈ\nၸၢၵ်ႈလုတ်ႇၼမ်ႉ 2 ၶိူင်ႈၼႆႉပဵၼ်ငိုၼ်းၵွင်ၵၢင်ၶွင်ၸုမ်းဢၼ်ၵဵဝ်ႇၵူႈမိူင်းမိူင်းၸွၺ်ႈထႅမ်မႃးၼၼ်ႉပဵၼ်တၢင်းဢွၵ်ႇယၢင်ႈတိၼ်ၼိုင်ႈယၢင်ႈတႃႇၵႂႃႇၸူးယိူင်းမၢႆ။","ၵၢၼ်ပိုတ်ႇႁွင်ႈယႃမႂ်ႇတီႈဝၢၼ်ႈၸုၼ်း​​တေႃး \n\nၵၢၼ်ပိုတ်ႇႁွင်ႈယႃတီႈဝၢၼ်ႈၸုၼ်း​​တေႃးၼႆႉ ပဵၼ်ၵၢၼ်ၸွၺ်ႈတူၺ်းထိုင်ပၢႆးယူႇလီၶွင်ၵူၼ်းၼႂ်းဝၢၼ်ႈ​​သေ ပဵၼ်ယၢင်ႈတိၼ် 1 ယၢင်ႈတႃႇၵႂႃႇၸူးယိူင်းမၢႆ။ ၵၢၼ်ၸွင်း​​ၸေးႁွင်ႈယႃႇၼႆႉ​​တေမီးၵၢၼ်သမ်းၶဵမ်​​ႁေႉၵင်တၢင်းပဵၼ်ၵူႈမဵဝ်းမဵဝ်း၊ လွင်ႈတူၺ်းထိုင်မႄႈလုၵ်ႈဢွၼ်ႇလႄႈလုၵ်ႈဢွၼ်ႇ လႄႈ ၵၢၼ်တူၺ်းထိုင်ပၢႆးယူႇလီၵူႈပိူင်ပိူင် \n\nႁွင်ႈယႃၼႆႉပဵၼ်ႁွင်ႈယႃတီႈၸုမ်းယူႇၼီသတ်ႉ လႄႈ ၵူၼ်းၼႂ်းဝၢၼ်ႈၶဝ်ႁူမ်ႈၵၼ်​​သေ​​ၵေႃႈသၢင်ႈမႃး၊ ယိူင်းဢၢၼ်းႁႂ်ႈလႆႈပဵၼ်ႁွင်ႈယႃတီႈ မီးၽွၼ်းလီၵဵဝ်ႇလူၺ်ႈလွင်ႈပၢႆးယူႇလီ​​သေဢမ်ႇၵႃး ​​တေႇၸွၺ်ႈထႅမ်လွင်ႈတၢင်းလူဝ်ႇၶိူင်ႈၸႂ်ႉတိုဝ်းပၢႆးယႃတီႈဢၼ်ႁဵတ်းႁႂ်ႈလူတ်ႉၵၢၼ်ၸပ်းတၢင်းပဵၼ် လႄႈ တေႁူမ်ႈၵၼ်သၢင်ႈႁႂ်ႈမိူၼ်ၼင်ၵၢင်ၸႂ်ၵူၼ်းဝၢၼ်ႈၶႂ်ႈပဵၼ်ၼၼ်ႉ။","ၵၢၼ်ပိုတ်ႇတွၼ်ႈႁပ်ႉႁူင်းႁဵၼ်းမႂ်ႇတီႈမူႇဝၢၼ်ႈ​​မေႃႇပီႇ \n\nမိူဝ်ႈပူၼ်ႉမႃးဝူင်ႈၼိုင်ႈၼႆႉ ၼႂ်းဝၢၼ်ႈ​​မေႃႇပီႇလႆႈၸတ်းႁဵတ်းပွၺ်းပိုတ်ႇႁူင်းႁဵၼ်းမႂ်ႇ။ ၼႂ်းႁူင်းႁဵၼ်းၼၼ်ႉမီး ႁွင်ႈႁဵၼ်း 5 ႁွင်ႈ​​သေ ​​တေၸွၺ်ႈၵမ်ႉထႅမ်ၵၢၼ်ႁဵၼ်းတႃႇလုၵ်ႈႁဵၼ်းၼႂ်းဝၢၼ်ႈႁႂ်ႈမီးၼမ်ႉလီ ၼမ်ႉတွၼ်းၼႂ်းၵၢၼ်ႁဵၼ်း။ \n\nၵူဝ်ႇမိၼ်း​​သေႃႇ​​ၵေႃႉပဵၼ်​​ပေႃႈလုၵ်ႈဢွၼ်ႇ 2 ၵေႃႉ လႆႈလၢတ်ႈၵႂၢမ်းငိၼ်းၸူမ်းဝႃႈ ႁူင်းႁဵၼ်းၼႆႉပဵၼ်ႁူင်ႁဵၼ်းတီႈဢၼ်ၸွၺ်ႈပူၵ်းပွင်လုၵ်ႈႁဵၼ်းၼႂ်းဝၢၼ်ႈလႄႈၼွၵ်ႈဝၢၼ်ႈယူႇယဝ်ႉ။ ႁူင်းႁဵၼ်းၼႆႉပဵၼ်ႁူင်းႁဵၼ်းဢၼ်လႆႈတၢင်းၸွၺ်ႈထႅမ်မႃးတီႈငိုၼ်းၵွင်ၵၢင်ၶွင်လူင်ပွင်ၸိုင်ႈလႄႈၵူၼ်းၼႂ်းဝၢၼ်ႈႁူမ်ႈၵၼ်သၢင်ႈၶိုၼ်ႈသေ ႁူင်းႁဵၼ်းၼႆႉ​​တေပဵၼ်ႁူင်းႁဵၼ်းတီႈဢၼ်​​တေၸွၺ်ႈၶၢဝ်းတၢင်မိူဝ်းၼႃႈၶွင်လုၵ်ႈႁဵၼ်း။"],"tc_q3":["ပၢင်ပွၺ်းဢၼ်ၾၢႆႇၸိုင်ႈမိူင်းႁၢင်ႈႁဵၼ်းတွၼ်ႈတႃႇၸတ်းႁဵတ်းၼၼ်ႉပဵၼ်ပၢင်ပွၺ်းသင် လိူၵ်ႈတွပ်ႇမႃးပၢင်ပွၺ်းပၢင်လဵဝ်?","မိူဝ်ႈလဵဝ် တႃႇ​​တေၵႂႃႇငၢႆမႃးလီလွတ်ႈ​​ၽေးၼၼ်ႉဢီႈသင်ၸွၺ်ႈၵူၼ်းၼႂ်းဝၢၼ်ႈ?","ၵဵဝ်ႇလူၺ်ႈၸၢၵ်ႇလုတ်ႉၼမ်ႉၼၼ်ႉၵူဝ်ႇဢွင်ႇမဵဝ်းလၢတ်ႈသင်?","ႁွင်ႈယႃတီႈဝၢၼ်ႈၸုၼ်း​​တေႃးမီးၵၢၼ်ၸွင်း​​ၸေးသင်လၢႆလၢႆ ? တွပ်ႇၵၢၼ်ၸွင်း​​ၸေးမႃး 1 မဵဝ်း","ၼႂ်းႁူင်းႁဵၼ်းၼႆႉမီးႁွင်ႈႁဵၼ်းလၢႆႁွင်ႉ?"],"tc_a3":["​​ၶေႃႈတွပ်ႇတီႈဢၼ်တွပ်ႇလႆႈ- ပၢင်ပွၺ်းၶၢႆပပ်ႉလိၵ်ႈ/ပၢင်ၶေႉသဵင်ဢၢၼ်ႇလိၵ်ႈ / ပၢင်ႁူပ်ႉထူပ်း​​မေႃတႅမ်ႈ","​​ၶေႃႈတွပ်ႇ- ၵၢၼ်တင်ႈသဝ်ၾႆးၶၢင်ႈတၢင်း","​​ၶေႃႈတွပ်ႇ- ၵွပ်ႈမီးၸၢၵ်ႈလုတ်ႇၼမ်ႉၼႆႉ​​ၵေႃႈလႆႈၼမ်ႉမူတ်းသႂ်လႄႈၸွၺ်ႈလူတ်ႉလွင်ႈၶၢတ်ႇႁဵၼ်းၶွင်လုၵ်ႈႁဵၼ်း","​​ၶေႃႈတွပ်ႇတီႈတွပ်ႇလႆႈ- မီးၵၢၼ်သမ်းၶဵမ်​​ႁေႉၵင်တၢင်းပဵၼ်ၵူႈမဵဝ်းမဵဝ်း၊\n လွင်ႈတူၺ်းထိုင်မႄႈလုၵ်ႈဢွၼ်ႇလႄႈလုၵ်ႈဢွၼ်ႇ လႄႈ \nၵၢၼ်တူၺ်းထိုင်ပၢႆးယူႇလီၵူႈပိူင်ပိူင်","​​ၶေႃႈတွပ်ႇ- ႁွင်ႈႁဵၼ်း 5 ႁွင်ႉ"],"tc_q4":["တွၼ်ႈတႃႇ​​တေသၢင်ႈႁူင်းတူၺ်းလိၵ်ႈၼႆႉၽႂ်လႂ်ပဵၼ်ၵူၺ်းၵမ်ႉထႅမ်ၸွၺ်ႈသၢင်ႈ?","တႃႇ​​တေလႆႈတင်ႈသူဝ်ႇလႃႇၾႆးၼႂ်းဝၢၼ်ႈၺွင်ႇ​​ၵျေးၼႆႉႁိုင်လၢႆလိူၼ်?","ၸၢၵ်ႈလုတ်ႇၼမ်ႉမႂ် _answer":["လႅၼ်ႈ","ၵႂႃႇ","ႁွင်ႉ","ၵိၼ်"],"g6I1_passage":["ၽႃႇတီႇမႃႇဢၢၼ်လိၵ်ႈၵူႈၶမ်ႈတွၼ်ႈတႃႇပၢင်တွပ်ႇလိၵ်ႈ။ မၼ်းၼၢင်းလုၵ်ႉၸဝ်ႉၸဝ်ႉ​​သေႁဵတ်းတွၼ်ႈၽိုၵ်း​​သေႁဵတ်း​​ၶေႃႈမၢႆတွင်းႁူဝ်ယွႆႈယဝ်ႉ။သင်ဝႃႈမၼ်းၼၢင်ဢမ်ႇပွင်ၸႂ်တွၼ်ႈၽိုၵ်ႈမၼ်းၼၢင်း​​တေၵႆႉၵႆႉထၢမ်​​မေႃသွၼ်။ မၼ်းၼၢင်း​​မီးၸႂ်ၶႂ်ႈဢွင်ႇပူၼ်ႉလႄႈတေႁိူဝ်ႉတၢၼ်ႇႁိုဝ်​​ၵေႃႈယဝ်ႉ ​​တေႇသိုပ်ႇၶတ်ၸႂ်ၵႂႃႇ။ မိူဝ်ႈထိုင်ဝၼ်းတွပ်ႇလိၵ်ႈ​​ၵေႃႈမၼ်းၼၢင်းလႆႈၽိုၵ်းတဵမ်တူဝ်မႃးယဝ်ႉလႄႈမၼ်းၼၢင်း​​ၵေႃႈမၼ်ႈၸႂ်ၼႂ်းတူဝ်မၼ်းဝႆႉ။","ဢႄးလႅၵ်ႉ​​တေ​​ၸႂ်ႉၶၢဝ်းယၢမ်းဢိုတ်းႁဵၼ်းၵေႃႇသၢင်ႈႁိူၼ်းမႂ်ႇၼိုင်ႈလင်။ မၼ်းၸၢႆးလႆႈတူၺ်းဝီတီးဢူဝ်းလွၵ်ႉလၢႆးၵၢၼ်​​ၵေႃႇသၢင်ႈႁိူၼ်း လႆႈလူႇၶိူင်ႈမိုဝ်းလၢႆး​​ၵေႃႇသၢင်ႈ လႄႈ လႆႈယွၼ််းတၢင်းႁၼ်ထိုင်တီႈၽူႈလူင်ႉလႅၼ်ႇလွင်ႈ​​ၵေႃႇသၢင်ႈ။ မၼ်းၸၢႆးလႆးႁဵတ်းၽိတ်း​​သေတႃႉ မၼ်ၸၢႆးဢမ်ႇယွမ်းသုမ်း။ မိူဝ်ႈၶၢဝ်းယၢမ်းပူၼ်ႉၵႂႃႉလၢႆဝၼ်းမၼ်းၸၢႆး​​ၵေႃႈ ​​ၵေႃႇသၢင်ႁိူၼ်းမႂ်ႇလင်ၼိုင်ႈယဝ်ႉတူဝ်လီငၢမ်း။","တႃႇရႃႇၸွၺ်ႈသပ်းလႅင်းလၢႆးၵႄႈလိတ်ႈ​​ၶေႃႈထၢမ်ပၢႆးၼပ်ႉႁႂ်ႈတႆး​​ၵေႃႉၼႂ်းၸၼ်ႉႁဵၼ်း။မၼ်းၸၢႆးၼႆႉၸႂ်ယၢဝ်း​​သေ​​မေႃသပ်းလႅင်းပၼ်ႁႂ်ႈၵူႈ​​ၵေႃႇလႆႈပွင်ၸႂ်။ယွၼ်ႉလွင်ႈတၢင်းၸွၺ်ႈထႅမ်ႈမၼ်းၸၢႆးလႄႈတႆး​​ၵေႃႉမၼ်းတင်းသဵင်ႈၵေႃႈမွၵ်ႇလၢတ်ႈ​​ၶေႃႈၵႂၢမ်းငိၼ်းၸူမ်း​​သေဝႆႉလွင်ႈၼမ်ႉယမ်ႉမၼ်းယူႇယဝ်ႉ။","သူဝ်ႇၾီႇမႆႈၸႂ်ၸွမ်းလွင်ႈ​​တေလႆႈ​​ၶေႉၶဵင်ႇႁွင်ႉၵႂၢမ်းၼႂ်းပၢင်ပွၺ်းၼႄၼမ်ႉၵတ်ႉတီႈႁူင်းႁဵၼ်း။ မၼ်းၼၢင်းလႆႈၽိုၵ်းႁွင်ႉၵႂၢမ်းပူၼ်ႉမႃးလၢႆဝၼ်း​​ၵေႃႈယဝ်ႉ မိူဝ်ႈထိုင်ၵမ်းမၼ်းၼၢင်း​​တေလႆႈႁွင်ႉၵႂၢမ်းၼၼ်ႉ မိုဝ်းမၼ်းၼၢင်းသၼ်ႇယူႇယဝ်ႉ။ မိူဝ်ႈသဵင်ၽဵင်းၵႂၢမ်း​​တေႇဢွၵ်ႇမႃးမၼ်းၼၢင်း​​ၵေႃႈသုတ်ႇလူမ်းႁၢႆၸႂ်ၶဝ်ႈလိုၵ်ႉလိုၵ်ႉ​​သေသႂ်ႇၸႂ်ႇလွင်ႈႁွင်ႉၵႂၢမ်းၼႆႉယူႇယဝ်ႉ။ မိူဝ်ႈမၼ်းၼၢင်းႁွင်ႉၵႂၢမ်းၼၼ်ႉမီးလွင်ႈမႆႈၸႂ်ယူႇ​​သေတႃႉ တႄႇမၼ်းၼၢင်း​​ၵေႃႈၵႄႈလိတ်ႈပၼ်ႁႃ​​တေႃႇၼႃႈလႆႈၵႂႃႇယဝ်ႉလႄႈမၼ်းၼၢင်​​ၵေႃႈၸူမ်း​​သေဢဝ်ၵုင်မုၼ်တူဝ်ၵဝ်ႇယူႇယဝ်။"],"g6I1_question":["ၽႃႇတီႇမႃႇႁဵတ်းႁိုဝ်​​ၵေႈလိတ်ႈပၼ်ႁႃလွင်ႈၶဵင်တႃႉတီႈဢၼ်မၼ်းၼၢင်းႁူပ်ႉထူပ်းလႄႈလၢႆႈ​​ၵေႈလိတ်ႈပၼ်ႁႃၼၼ်ႉလႆႈၸွၺ်ႈထႅမ်မၼ်းၼၢင်းၸိူင်ႉႁိုဝ် ?","ဢႄးလႅၵ်ႉႁဵတ်းႁိုဝ်​​ၵေႈလိတ်ႈပၼ်ႁႃလွင်ႈၶဵင်တႃႉၵၢၼ်​​ၵေႃႇသၢင်ႈႁိူၼ်းမႂ်ႇ? မီးၽွၼ်းလီၸိူင်ႉႁိုဝ်?","တႃႇရႃႇႁဵတ်းႁိုဝ်တုမ်ႉတွပ်ႇငဝ်းလၢႆးတႆး​​ၵေႃႉၼႂ်းႁွင်ႈႁဵၼ်းၸိူင်ႉႁိုဝ်?  ၵၢၼ်တုပ်ႉတွပ်ႇၼႆႉမီးၽွၼ်လီတႃႇ​​ၶေႃႈလူပ်းလင်ၸိူင်ႉႁိုဝ်?","သူဝ်ႇၾီႇႁဵတ်းႁိုဝ်တုမ်ႉတွပ်ႇလွင်ႈမႆႈၸႂ်မၼ်းၼၢင်းၸိူင်ႉႁိုဝ် လႄႈ ၽွၼ်းလီမၼ်းပဵၼ်ၸိူင်ႉႁိုဝ်?"],"g6I1_options":["ၽႃႇတီႇမႃႇဢမ်ႇႁဵတ်းလိၵ်ႈလႄႈတွပ်ႇလိၵ်ႈတူၵ်း။ မိူဝ်ႈႁူပ်ႉထူပ်းငဝ်းလၢႆးမၼ်းယၢပ်ႇၼၼ်ႉ မၼ်းၸၢႆး​​ၵေႃႈလႆႈယွမ်းသုမ်းလႄႈဢမ်ႇမီႈလွင်ႈၶိုပ်ႈၼႃႈမႃး။ \n\nၽႃႇတီႇမႃႇၶတ်းၸႂ်​​သေမိူဝ်ႈယၢမ်းဢမ်ႇပွင်ၸႂ်တွၼ်ႈၽိုၵ်ႈမၼ်းၼၢင်း​​တေၵႆႉၵႆႉထၢမ်​​မေႃသွၼ် လႄႈ မိူဝ်ႈထိုင်ဝၼ်းတွပ်ႇလိၵ်ႈ​​ၵေႃႈမၼ်းၼၢင်းလႆႈၽိုၵ်းတဵမ်တူဝ်မႃးယဝ်ႉလႄႈမၼ်းၼၢင်း​​ၵေႃႈမၼ်ႈၸႂ်ၼႂ်းတူဝ်မၼ်းဝႆႉ။\n\nၽႃႇတီႇမႃႇတုၺ်းလိၵ်ႈ ဢမ်ႇယင်ႉလိုဝ်ႈ လႄႈ မိူဝ်ႈထိုင်ဝၼ်းတွပ်ႇလိၵ်ႈ​​ၵေႃႈ မၼ်းၸၢႆးႁိူဝ်ႉၸႂ်ယူႇ။","ဢႄးလႅၵ်ႉဢမ်ႇလႆႈတၢင်းၸွၺ်ႈထႅမ်တီႈၽူႈလူင်ႉလႅၼ်​​သေ ​​ၵေႃႈသၢင်ႈႁိူၼ်းမႂ်ႇလင်ၼိုင်ႈလူၺ်ႈတီႈမီ​​ၶေႃႈႁဵတ်းၽိတ်းၼမ်ၼႃႉလႄႈထိုင်တီႈၶူင်းၵၢၼ်​​ၵေႃႇသၢင်ႈလႆႈလုသုမ်းယဝ်ႉ။ \n\nဢႄးလႅၵ်ႉ​​တေႇသၢင်ႈႁိူၼ်းမႂ်ႇ​​သေတႃႉ မိူဝ်ႈႁုႉဝႃႈမၼ်းယၢပ်ႇ မၼ်းၸၢႆးလႆႈၵိုတ်းလိုဝ်ႈၵမ်းလဵဝ်။\n\nဢႄးလႅၵ်ႉၸႂ်ဢမ်ႇလီၵွပ်ႈမၼ်းႁဵတ်းၽိတ်းၼမ်ၼႃႉလႄႈလႆႈပႅတ်ႇၶူင်းၵၢၼ်​​ၵေႃႇသၢင်ႈ။\n\nဢႄးလႅၵ်ႉႁဵတ်းလွင်ႈၽိတ်းၵႂႃႇ​​သေတႃႉ ၵွပ်ႈဝႃႈမၼ်းၸၢႆးသိုပ်ႇၶတ်းၸႂ်လႄႈထိုင်ၵမ်းလိုၼ်းသုတ်းမႃးမၼ်း​​ၵေႃႈ သၢင်ႈႁိူၼ်းလႆႈယဝ်ႉတူဝ်လီငၢမ်း။","တႃႇရႃႇၸႂ်လမ်တႆး​​ၵေႃႉၼႂ်ႈႁွင်ႈႁဵၼ်း​​သေၵိုတ်းလိုဝ်ႈၵၢၼ်သပ်းလႅင်း။ \n\nတႃႇရႃႇဢမ်ႇသူၼ်ၸႂ်တႆး​​ၵေႃႉၼႂ်းႁွင်ႈႁဵၼ်း​​သေ ဢမ်ႇၸွၺ်ႈသပ်းလႅင်း​​ၶေႃႈထၢမ်ပၢႆးၼပ်ႉ။ \n\nတႃႇရႃႇဝႆႉၸႂ်ယၢဝ်းယၢဝ်း​​သေၸွၺ်ႈသပ်းလႅင်းပၼ်တႆး​​ၵေႃႉမၼ်းလႄႈ မၼ်းၸၢႆးလႆႈလွင်ႈၼမ်ႉယမ်တီႈတႆး​​ၵေႃႉမၼ်း \n\nတႃႇရႃႇၶတ်းၸႂ်ၸွၺ်ႈတႆး​​ၵေႃႉမၼ်းယူႇ​​သေတႃႉ တႆး​​ၵေႃႉမၼ်း​​ၵေႃႈဢမ်ႇဝႆႉၵႃႊၶၼ်သင်။","မိူဝ်ႈသူဝ်ႇၾီႇၶိုၼ်ႈႁွင်ႉၵႂၢမ်းၼၼ်ႉ မၼ်းလိုမ်းတူၼ်ႈထႅဝ်ၵႂၢမ်ႈ​​လႄႈ မၼ်းၸႂ်လဵၵ်ႉၵႂႃႇ။\n\nသူဝ်ႇၾီႇမီးလွင်ႈမႆႈၸႂ်ၼိူဝ်လွင်ႈႁွင်ႉၵႂၢမ်းယူႇ​​ၼႆသေတႃႉ တႄႇမၼ်းၼၢင်း​​ၵေႃႈၵႄႈလိတ်ႈပၼ်ႁႃ​​တေႃႇၼႃႈလႆႈၵႂႃႇယဝ်ႉလႄႈမၼ်းၼၢင်​​ၵေႃႈၸူမ်း​​သေဢဝ်ၵုင်မုၼ်တူဝ်ၵဝ်ႇယူႇယဝ်ႉ။ \n\nသူဝ်ႇၾီႇမီးလွင်ႈမႆႈၸႂ်ၼိူဝ်လွင်ႈႁွင်ႉၵႂၢမ်းၼႃႇလႄႈထိုင်တီႈသိုပ်ႉႁွင်ႉဢမ်လႆႈ​​သေလႆႈလူင်းၼိူဝ်ၶဵင်ႇယူႇယဝ်ႉ။ \n\nသူဝ်ႇၾီႇမီးလွင်ႈမႆႈၸႂ်လႄႈဢမ်ႇၵုမ်ႉထိင်းလႆႈလႄႈထိုင်တီႈသိုပ်ႉႁွင်ႉဢမ်လႆႈ​​​​သေ ႁဵတ်းႁႂ်ႈလွင်ႈႁွင်ႉၵႂၢမ်းလုၵႂႃႇယဝ်ႉ။"],"g6I1_answer":["ၽႃႇတီႇမႃႇၶတ်းၸႂ်​​သေမိူဝ်ႈယၢမ်းဢမ်ႇပွင်ၸႂ်တွၼ်ႈၽိုၵ်ႈမၼ်းၼၢင်း​​တေၵႆႉၵႆႉထၢမ်​​မေႃသွၼ် လႄႈ မိူဝ်ႈထိုင်ဝၼ်းတွပ်ႇလိၵ်ႈ​​ၵေႃႈမၼ်းၼၢင်းလႆႈၽိုၵ်းတဵမ်တူဝ်မႃးယဝ်ႉလႄႈမၼ်းၼၢင်း​​ၵေႃႈမၼ်ႈၸႂ်ၼႂ်းတူဝ်မၼ်းဝႆႉ။","ဢႄးလႅၵ်ႉႁဵတ်းၽိတ်းၵႂႃႇ​​သေတႃႉ ၵွပ်ႈဝႃႈမၼ်းသိုပ်ႇၶတ်းၸႂ်လႄႈထိုင်ၵမ်းလိုၼ်းသုတ်းမႃးမၼ်း​​ၵေႃႈ သၢင်ႈႁိူၼ်းလႆႈယဝ်ႉတူဝ်လီငၢမ်း။",null,"သူဝ်ႇၾီႇမီးလွင်ႈမႆႈၸႂ်ၼိူဝ်လွင်ႈႁွင်ႉၵႂၢမ်းယူႇ​​ၼႆသေတႃႉ တႄႇမၼ်းၼၢင်း​​ၵေႃႈၵႄႈလိတ်ႈပၼ်ႁႃ​​တေႃႇၼႃႈလႆႈၵႂႃႇယဝ်ႉလႄႈမၼ်းၼၢင်​​ၵေႃႈၸူမ်း​​သေဢဝ်ၵုင်မုၼ်တူဝ်ၵဝ်ႇယူႇယဝ်။"],"g6I2_question":["ၼႂ်းတူၼ်ႈထႅဝ်ပႃႈတႂ်ႈၼႆႉတူၼ်ႈထႅဝ်လႂ်ၼႄလွင်ႈၶုၺ်ႇႁၼ်တူဝ်ထူပ်းႁူဝ်ယွႆႈ ဢမ်ႇၼၼ် လွင်ႈၼႄဢၼ်တႅတ်ႈၼႅတ်ႈ ?( လိူၵ်းတင်းမူတ်း)","ၼႂ်းတူၼ်ႈထႅဝ်ပႃႈတႂ်ႈၼႆႉတူၼ်ႈထႅဝ်လႂ်ၼႄလွင်ႈၶုၺ်ႇႁၼ်တူဝ်ထူပ်းႁူဝ်ယွႆႈ ဢမ်ႇၼၼ် လွင်ႈၼႄဢၼ်တႅတ်ႈၼႅတ်ႈ ?( လိူၵ်းတင်းမူတ်း)","ၼႂ်းတူၼ်ႈထႅဝ်ပႃႈတႂ်ႈၼႆႉတူၼ်ႈထႅဝ်လႂ်ၼႄလွင်ႈၶုၺ်ႇႁၼ်တူဝ်ထူပ်းႁူဝ်ယွႆႈ ဢမ်ႇၼၼ် လွင်ႈၼႄဢၼ်တႅတ်ႈၼႅတ်ႈ ?( လိူၵ်းတင်းမူတ်း)","ၼႂ်းတူၼ်ႈထႅဝ်ပႃႈတႂ်ႈၼႆႉတူၼ်ႈထႅဝ်လႂ်ၼႄလွင်ႈၶုၺ်ႇႁၼ်တူဝ်ထူပ်းႁူဝ်ယွႆႈ ဢမ်ႇၼၼ် လွင်ႈၼႄဢၼ်တႅတ်ႈၼႅတ်ႈ ?( လိူၵ်းတင်းမူတ်း)"],"g6I2_options":["တႃႇ​​တေႁဵတ်းလွင်ႈမူတ်းသႂ်ၼႂ်းႁူင်းႁဵၼ်းၼႆႉ ​​တေမီးၽူႈၸွၺ်ႈၵၢၼ်​​ၸေႇတၼႃႇ လႄႈ \n​​တေလႆႈႁၢင်ႈႁႅၼ်းၵူႊလွင်ႈႁႂ်ႈတႅတ်ႈၼႅတ်ႈ \n\nဢဝ်တၢင်းၵိၼ်မႃးလူၺ်ႈတီႈဢမ်ႇလႆႈၶႂၢင်ႉ\n\nၸႅၵ်ႇၵိၼ်တၢင်းၵိၼ်ၸွမ်းတႆး​​ၵေႃႉၼႂ်းႁွင်ႈႁဵၼ်းတီႈဢၼ်တွင်ႉမႆႈယူႇၼၼ်ႉ​​သေ တူၺ်းၼႃႈတႃဢၼ်ၸိုၼ်ႈသႂ်ၶွင်ၶဝ် \n\nသႂ်ႇၸႂ်ထွမ်ႇ​​ၶေႃႈထၢမ်လုၵ်ႈႁဵၼ်းၸၼ်ႉလဵၵ်ႉ​​ၵေႃႉၼိုင်ႈ​​သေ ၸွၺ်ႈထႅမ်လိၵ်ႈၵၢၼ်ႁိူၼ်း။\n\nဢမ်ႇသူၼ်ၸႂ်တႆး​​ၵေႃႉတီႈလူဝ်ႇတၢင်းၸွၺ်ႈထႅမ်။ \n\nမိူဝ်ႈၸွၺ်ႈ​​တေႃႉၵုၼ်ႇႁႅင်ႈပၼ်ၵူၼ်းထဝ်ႈ​​ၵေႃႉၼိုင်ႈၼၼ်ႉ မိူၼ်မၼ်းၶုၺ်ႉႁၼ်ၼမ်ႉၼၵ်းၼႂ်းမိုဝ်း။","လူႇသိူဝ်ႈၶူဝ်းပၼ်ၵူၼ်းထူပ်း​​ၽေး ​သေ သပ်းလႅင်ၼႄလွင်ႈၽွၼ်းလီလႄႈလွင်ႈဢုၼ်ႇၶွင်သိူဝ်ႈၶူဝ်း။ \n\nပႅတ်ႈယုပ်းယၢပ်းၼိူဝ်ၽၢၵ်ႈ\n\nၶူဝ်ၵူၼ်းတီႈလူမ်ႉ\n\nလၵ်ႉတႅမ်ႈၵၢၼ်ႁိူၼ်းၶွင်ၵူၼ်း​​ၵေႃႉၼိုင်ႈ \n\nၸွၺ်ႈ​​တေႃႉပပ်ႉလိၵ်ႈၼၵ်းလၢႆလၢႆပပ်ႉ​​သေ ၶုၺ်ႉႁၼ်ဝႃႈၶႅၼ်ၼူႁဝ်းၼႆႉမူတ်းႁႅင်း။ \n\nၸွၺ်ႈၸီႉၼႄတၢင်းပၼ်ၵူၼ်းတီႈၵင်တၢင်း","ၵဵပ်းယုပ်းယၢပ်းၼႂ်းသူၼ်သိူဝ်း​​သေထွမ်ႇသဵင်သၽႃႇဝ\n\nလိုမ်းၶိုၼ်ၶူဝ်းၶွင်ဢၼ်လႆႈႁိမ်မႃး\n\nတွၼ်ႈတႃႇၼႄလိၵ်ႈသပ်းလႅင်းပၼ်တႆး​​ၵေႃႉၼႂ်းႁွင်ႈႁဵၼ်းၼၼ်ႉ ၶူၼ်ႉႁႃထွၺ်ႈၵႂၢမ်းလီလီတီႈဢၼ်ၵဵဝ်ႇလူၺ်ႈလွင်ႈတၢင်း။ \n\nပိုတ်ႇၽၵ်းတူပၼ်ၵူၼ်းမၢင်​​ၵေႃႉ​​သေ ၶုၺ်ႇႁၼ်ၼိူဝ်ၼိူဝ်ႉၼင်ဝႃႈမီးလူမ်းၵတ်းလူမ်းယဵၼ်\n\nလၢတ်ႈၵႂၢမ်းမိူဝ်ႈတွပ်ႇလိၵ်ႈ","တႃးသီပၢႆႉတႃႇပွၺ်းႁႃငိုၼ်းၵွင်ၵၢင်​​​​သေလေႃးသီၵၼ်\n\nဢမ်ႇႁဵတ်းၸွမ်းၼင်ႇ​​ၶေႃႈၸီႉသင်ႇ။\n\nမိူဝ်ႈလူဢၢၼ်ႇလိၵ်ႈပၼ်ၼွင်ႉၸၢႆး/ယိင်းၼၼ်ႉ လႆႈႁူႉၶိုၼ်းၵမ်းလဵဝ်ဝႃႈၶဝ်တိုၼ်ႇတဵၼ်ႈ။\n\nမိူဝ်ႈၸွၺ်ႈ​​တေႃႉၶွင်ပၼ်​​မေႃသွၼ်ၼၼ်ႉ ၶုၺ်ႉႁၼ်ဝႃႈပပ်ႉလိၵ်ႈတီႈယိုပ်းဝႆႉၼၼ်ႉမီးၼမ်ႉၼၵ်း။\n\nဝႆႉၶွင်ႁႂ်ႈၵိုတ်ႇၼႃႈၵိုတ်ႇတႃတီႈႁူင်းၵိၼ်ၶဝ်ႈ။\n\nဢမ်ႇၸႅၵ်ႇၶွင်ပၼ်။"],"g6I2_answer":["တႃႇ​​တေႁဵတ်းလွင်ႈမူတ်းသႂ်ၼႂ်းႁူင်းႁဵၼ်းၼႆႉ ​​တေမီးၽူႈၸွၺ်ႈၵၢၼ်​​ၸေႇတၼႃႇ လႄႈ \n​​တေလႆႈႁၢင်ႈႁႅၼ်းၵူႊလွင်ႈႁႂ်ႈတႅတ်ႈၼႅတ်ႈ \n\nၸႅၵ်ႇၵိၼ်တၢင်းၵိၼ်ၸွမ်းတႆး​​ၵေႃႉၼႂ်းႁွင်ႈႁဵၼ်းတီႈဢၼ်တွင်ႉမႆႈယူႇၼၼ်ႉ​​သေ တူၺ်းၼႃႈတႃဢၼ်ၸိုၼ်ႈသႂ်ၶွင်ၶဝ် \n\nသႂ်ႇၸႂ်ထွမ်ႇ​​ၶေႃႈထၢမ်လုၵ်ႈႁဵၼ်းၸၼ်ႉလဵၵ်ႉ​​ၵေႃႉၼိုင်ႈ​​သေ ၸွၺ်ႈထႅမ်လိၵ်ႈၵၢၼ်ႁိူၼ်း။\n\nမိူဝ်ႈၸွၺ်ႈ​​တေႃႉၵုၼ်ႇႁႅင်ႈပၼ်ၵူၼ်းထဝ်ႈ​​ၵေႃႉၼိုင်ႈၼၼ်ႉ မိူၼ်မၼ်းၶုၺ်ႉႁၼ်ၼမ်ႉၼၵ်းၼႂ်းမိုဝ်း။","လူႇသိူဝ်ႈၶူဝ်းပၼ်ၵူၼ်းထူပ်း​​ၽေး ​သေ သပ်းလႅင်ၼႄလွင်ႈၽွၼ်းလီလႄႈလွင်ႈဢုၼ်ႇၶွင်သိူဝ်ႈၶူဝ်း။ \n\nၸွၺ်ႈ​​တေႃႉပပ်ႉလိၵ်ႈၼၵ်းလၢႆလၢႆပပ်ႉ​​သေ ၶုၺ်ႉႁၼ်ဝႃႈၶႅၼ်ၼူႁဝ်းၼႆႉမူတ်းႁႅင်း။ \n\nၸွၺ်ႈၸီႉၼႄတၢင်းပၼ်ၵူၼ်းတီႈၵင်တၢင်း","ၵဵပ်းယုပ်းယၢပ်းၼႂ်းသူၼ်သိူဝ်း​​သေထွမ်ႇသဵင်သၽႃႇဝ\n\nတွၼ်ႈတႃႇၼႄလိၵ်ႈသပ်းလႅင်းပၼ်တႆး​​ၵေႃႉၼႂ်းႁွင်ႈႁဵၼ်းၼၼ်ႉ ၶူၼ်ႉႁႃထွၺ်ႈၵႂၢမ်းလီလီတီႈဢၼ်ၵဵဝ်ႇလူၺ်ႈလွင်ႈတၢင်း။ \n\nပိုတ်ႇၽၵ်းတူပၼ်ၵူၼ်းမၢင်​​ၵေႃႉ​​သေ ၶုၺ်ႇႁၼ်ၼိူဝ်ၼိူဝ်ႉၼင်ဝႃႈမီးလူမ်းၵတ်းလူမ်းယဵၼ်","တႃးသီပၢႆႉတႃႇပွၺ်းႁႃငိုၼ်းၵွင်ၵၢင်​​​​သေလေႃးသီၵၼ်\n\nမိူဝ်ႈလူဢၢၼ်ႇလိၵ်ႈပၼ်ၼွင်ႉၸၢႆး/ယိင်းၼၼ်ႉ လႆႈႁူႉၶိုၼ်းၵမ်းလဵဝ်ဝႃႈၶဝ်တိုၼ်ႇတဵၼ်ႈ။\n\nမိူဝ်ႈၸွၺ်ႈ​​တေႃႉၶွင်ပၼ်​​မေႃသွၼ်ၼၼ်ႉ ၶုၺ်ႉႁၼ်ဝႃႈပပ်ႉလိၵ်ႈတီႈယိုပ်းဝႆႉၼၼ်ႉမီးၼမ်ႉၼၵ်း"],"g5I1_options":["ၵလႃးဢူၵ်ႉ​​ၶေႃးယၢဝ်းပဵၼ်သတ်းတီႈဢၼ်မီး​​ၽေး။ \nၵလႃးဢူၵ်ႉ​​ၶေႃးယၢဝ်းပဵၼ်သတ်းတီႈယူႇသဝ်းတီႈပွတ်းတွၼ်ႈၾိင်ႈၾႃႉရႃႇသီႇၵတ်း။\nၵလႃးဢူၵ်ႉ​​ၶေႃးယၢဝ်းပဵၼ်သတ်းတီႈၵိၼ်ၼိူဝ်ႉသတ်း။ \nၵလႃးဢူၵ်ႉ​​ၶေႃးယၢဝ်းပဵၼ်တူဝ်သတ်းတီႈဢၼ်တူဝ်သုင်တီႈသုတ်း။","ပႃ​​ဝေးပဵၼ်သတ်းတီႈၵိၼ်ၵလႃးဢူၵ်ႉ​​ၶေႃးယၢဝ်း။\nပႃ​​ဝေးပဵၼ်သတ်းတီႈယူႇၼိူဝ်ၵွင်း။\nပႃ​​ဝေးပဵၼ်သတ်းတူဝ်လူင်ၼႂ်းပၢင်ႇလၢႆႇလူင်။ \nပႃ​​ဝေးပဵၼ်သတ်းၵၢၼ်း။","ၼူၵ်ႉၽႅၼ်ႇၵႂိၼ်းယူႇသဝ်းတီႈႁၢတ်ႇသၢႆး။\nၼူၵ်ႉၽႅၼ်ႇၵႂိၼ်းမိၼ်ၶိုၼ်ႈလႆႈသုင်သုင်။\nၼူၵ်ႉၽႅၼ်ႇၵႂိၼ်းပဵၼ်သတ်းၼမ်ႉတီႈဢၼ်လုၺ်းၼမ်ႉၶႅၼ်ႇလႄႈယူႇသဝ်းတီႈပွတ်းတွၼ်ႈၾိင်ႈၽႃႇရႃႇသီၵတ်း။ \nၼူၵ်ႉၽႅၼ်ႇၵႂိၼ်းၵိၼ်တူၼ်ႈမႆႉ။","တူဝ်ႁွပ်ႇလုၵ်ႈယူႇၼႂ်းၼမ်ႉ။\nတူဝ်ႁွပ်ႇလုၵ်ႈမိၼ်  ai."],"text_2":["Malar gaw kanu yen kawa hte mare kasha langai kaw rau nga ai. Bai nna shi kabu Thaung gaw Muklum kaba de jawng lung let nga ai. Malar gaw Thaung nta wa yang grai kabu ai hte shan lahkawng arau ginsup ai. Shi nu gaw shan lahkawng hpe malu masha ni ma grai law hkra galaw jaw ai. Malar gaw shi kabu Thaung jawng bai sa ai shaloi hta Thaung hpe \"nta de hpang kalang bai wa rit\" ngu nna shakram dat ai.","Htet gaw shi kawoi ni hte Muklum kasha kaw nga ai. Shi na majing n re ai kabu Kyaw gaw daksu lung let Muklum kaba kaw nga ai. Kyaw gaw Htet kaw wa chyai yang Htet gaw grai pyaw ai hte Kyaw hte arau ginsup ai, kawoi ni hkyen ya ai grai mu ai malu masha ni hpe sha let aten ni hpe pyaw pyaw shalai ai. Kyaw gaw daksu lung na matu bai wa na shaloi shi kabu hpe shakram dat ai.","Sawyer gaw shi na kanu kawa ni hte Muklum kasha kaw nga ai. Shi na kana shawng Mai gaw daksu lung let Muklum kaba kaw nga ai. Sawyer gaw shi kana shawng Mai nta de wa yang grai kabu ai. Bai nna, Mai hte arau ginsup let kanu shadu ya ai grai mu ai malu masha ni hpe sha let aten ni hpe pyaw pyaw shalai ai. Shi kana daksu bai sa lung na shaloi hta shi kana hpe \"hpang de bai wa rit\" ngu nna shakram dat ai.","Thida gaw shi Kanu tung hte Kawa di ni hte mare kaji kaw nga ai. Shi majing n re ai kana shawng Htet gaw dakasu lung na matu munklung kaba kaw nga ai. Thida gaw Htet wa chyai na hpe grai myit mada ai. Shan yan gaw games ni ginsup nna kanu tung shadu jaw sha ai lu sha ni hte grai pyaw ma ai. Htet dakkasu de bai sa mat wa ai shaloi Thida gaw \"Gade nna yang bai sa chyai rit\" nga shakram dat sai.","Min Min gaw shi Kanu yan Kawa ni hte mare kaji kaw nga ai. Shi kahpu Kyaw gaw bungli galaw na matu munklung kaba kaw nga ai. Min Min gaw Kyaw wa chyai ai ten grai pyaw ai. Shan yan gaw games ni ginsup nna kanu kawa ni shadu jaw sha ai lu sha ni hte grai pyaw ma ai. Kyaw Muklum de bai sa mat wa ai shaloi Min Min gaw ahpum let \"Gade nna yang bai sa chyai rit\" nga shakram dat sai."],"sentence_1":["Nandar gaw dusat dumyen grai ra ai majaw dusat lawng de sa ai.","Hla Hla gaw laika buk hti ai myit lawm ai majaw laika dum de sa ai.","Sai gaw shinggan de ginsup ai hpe ra ai majaw nampan sun de sa ai.","Maung gaw hka hpungyawt ai hpe ra ai majaw hka hkying gau de sa ai.","Kyaw gaw namsi namsaw mari mayu ai majaw gat de sa ai."],"question_1":["Nandar gara de sa ai rai?","Hla Hla gara de sa ai rai?","Sai gara de sa ai rai?","Maung gara de sa ai rai?","Kyaw gara de sa ai rai?"],"answer_1":["Dusat lawng de.","Laika dum de.","Nampan sun de.","Hka hkying gau de.","Gat de."],"sentence_2":["Naing gaw manang ni hte nampan sun kaw ginsup nga ai.","Khin Khin gaw machyi ai majaw tsi rung sa ai.","Hla Hla gaw laika hti ai hpe ra ai majaw laika dum de sa ai.","Aung Aung gaw shani maka hte seng nna myit lawm ai majaw madun gawk de sa ai.","Thant gaw akyu hpyi la mayu ai majaw nawku jawng de sa ai."],"question_2":["Naing gaw gara de wa ginsup ai rai?","Khin Khin gara de sa ai rai?","Hla Hla gara de sa ai rai?","Aung Aung gara de sa ai rai?","Thant gara de sa ai rai?"],"answer_2":["Nampan sun kaw.","Tsi rung de.","Laika dum de.","Madun gawk de.","Nawku jawng de."],"tc_text_1":["Champo gaw shi kanu muk mari shangun ai majaw gat seng de lagaw hku sa ai. Bai nna shi gaw shi nu hpe lu garum sai majaw grai kabu ai hte sa ai hta lam kaw hku kaba waw ai hpe n mu na galau sha ai majaw lagaw bum mat ai.","May hpe shi na sara matsing laika buk nnan hpe mari shun ai majaw laika buk seng de sa ai. Shaloi, shi sara hpe lu garum ai hpe kabu let sa ai hta lam n tsawm ai hpe n mu hkrum ai majaw galau sha na lagaw grai machyi la mat ai.","Htet Htet hpe shi kana shawng gawdin hpe sa la shun ai majaw nampan sun de sa mat wa ai. Shi gaw shi kana shawng hpe lu garum ai majaw grai kabu let sa ai hta hpun ru hta galau sha nna lagaw bum mat ai.","Nay Nay hpe shi dwi gaw sama wan shadaw hpe shadun shun ai majaw hpunggyi jawng de sa mat ai. Nay Nay gaw shi dwi hpe lu garum ai majaw kabu let sa ai hta nlung tawng gaw galau sha na lagaw machyi sha mat ai.","Thura hpe shi wa gaw hka ja shun ai majaw hka hkying gau de sa mat ai. Shaloi, shi gaw shi wa hpe lu garum ai hpe gabu let hka sa ja ai hta hpun ru kaw galau sha na galaw machyi sha mat ai."],"tc_q1":["Champo hpa majaw gat seng de sa ai?","May hpa majaw laika buk seng de sa ai?","Htet Htet hpa majaw nampan sun de sa ai?","Nay Nay na kadwi gaw Nay Nay hpe hpunggyi jawng de hpa sa galaw shangun ai?","Thura hpa majaw hka hkying gau de sa ai?"],"tc_a1":["Mahtai- Muk mari na matu.","Mahtai- Matsing laika buk mari na matu.","Mahtai- Gawdin sa la na matu.","Mahtai- Sama wan shadaw shachyi na matu.","Mahtai- Hka sa ja na matu."],"tc_q2":["Champo a lagaw hpa majaw bum mat ai rai?","May na lagaw hpa majaw grai machyi mat ai rai?","Htet Htet na lagaw hpa majaw bum mat ai?","Nay Nay na lagaw hpa majaw bum ai?","Thura na lagaw hpa majaw bum mat ai?"],"tc_a2":["Galau sha ai majaw.","Galau sha ai majaw.","Galau sha ai majaw.","Galau sha ai majaw.","Galau sha ai majaw."],"tc_text_2":["Yangon hta buga laika dum nnan hpaw poi lamang.\nLai wa sai bat hta hkaja ai lam hte buga lamang ni galaw lu na matu buga laika dum nnan hpe hpaw tawn da lu sai re. Dai laika dum hta prat dep arung arai ni hte laika buk law law hpe hkaja la lu na matu hte hkring sa la lu na matu shara ni hpe mung lajang da ya saga ai.\n  Dai Muklum hta lamang amyu myu, laika buk madun poi, laika hti shingjawng poi hte laika ka sara ni hte hkrum shaga lu na matu hkyen lajang da ga ai. Dai laika dum gawgap ai lam hta UNICEF hte buga masha ni pawng nna laika hti hkaja mayu ai ginra masha ni law htam wa na matu yaw shada let gawgap da ga  ai re.","Solar hte Nyawng mare hpe myihprap wan jaw ai lam. Ndai laman hta,\nNyawng mare hpe solar hte myihprap wan lu jaw ai majaw mare masha ni hpe madi shadaw ya lu ai lam hte myit mada lam jaw ya lu ai.\nNdai myihprap wan gaw mare masha ni matu aten galu myit mada lam hte grau hkrak ai prat hpe madi shadaw ya lu ai. Ndai masing gaw shata 5 na ai hte, asuya hte laga wuhpung wuhpawng ni a n-gun dat ai lam a majaw lu la ai re. Ndai buga gaw htawm hpang de grau rawt jat galu kaba na hpe kam ai.","Thayet mare hta Hkachyup jak nnan a akyu ara. Thayet mare hta hkachyup jak nnan shakap da lu sai majaw mare masha ni hpe hka jaw ai hta grai na lu madi shadaw ya lu wa ai. Ndai hkachyup jak gaw mare masha ni hpe hka san jaw lu ai sha n-ga, shawoi na zawn mare masha ni grai tsan ai de hka sa gun ja ra ai lit ni hpe shayawm kau ya lu ai. \"Hka san lu lang ai majaw mare na jawngma ni hka n tsawm ai lu na machyi makaw byin ai lam hpe mung shayawm kau ya lu ai\", nga nna buga sara langai rai ngai ai Ko Aung Myo tsun ai. Dai hkachyup jak shakap ai gaw mungkan garum matum hpum kawn woi awn nna grau dam lada rawt jat wa hkra woi galaw ai lam re.","Kyun Taw mare hta tsi gawk hpaw ai lam. Kyun Taw mare hta tsi gawk hpaw ai gaw mare buga a hkamja lam rawt jat lam lahkam langai re. Tsi gawk hta makawp maga tsi htu ya ai lam, ma ni hte ma kanu ni hpe lakawn lanawn ai lam ni hte laga magup sumhpa hkamja lam ni hpe jaw ya ai. Ndai tsi gawk hpe UNICEF hte buga masha ni pawng nna madi shadaw galaw ai lam a awngdang lam langai rai nga ai hpe htawng madun lu ai. Tsi gawk gaw ra ai tsi ni hpe mai lu nna, ana makawp maga tsi ni hpe mung lu na matu buga masha ni myit mada da ga ai.","Hmawbi mare hta jawng nnan hpaw ai lam. Hmawbi mare hta lai wa sai bat hta jawng nnan hpaw poi galaw la lu lai wa sai. Laika sharin gawk5 lawm ai jawng gaw mare na jawngma ni hpaji sharin la lu na matu yaw shada let hpaw da ai re. Mare na kanu kawa rai nga ai Ko Myin Zaw gaw shi kasha lahkawng hte laga jawngma ni hpe jawng kaw na madi shadaw ya ai lam a majaw grai kabu chyeju dum ai lam tsun ai. Jawng hpe asuya hte buga masha ni pawng htawm hpang de atsawm hkanngzing na matu buga masha ni ga sadi jaw ai hte gawgap da ai lam re."],"tc_q3":["Laika dum ningnan kaw galaw na lamang lagai hpe ka ya rit.","Buga masha ni shana hkawm sa hkawm wa loi na matu hpa ni galaw ra na kun?","Ginra sara langai rai nga ai Ko Aung Myo gaw hkachyup jak nnan hte seng nna hpa tsun lai wa ai kun?","Kyun Taw mare na tsi gawk kaw na jaw ya ai hkamja lam hte seng ai lam langai hpe tsun dan rit.","Jawng nnan kaw laika sharin gawk gade nga ai kun?"],"tc_a3":["Mai byin ai mahtai- Laika buk madun lamang, laika hti shingjawng lamang, hte laika ka sara ni hte hkrum shaga ai lamang","Mahtai- Lam wan","Mahtai- Aten galu machyi ai hpe shayawm lu na matu","Mai byin ai mahtai- Makawp maga tsi htu ya ai, Ma ni hte kanu ni hpe makawp maga tsi jaw ai, magup sumhpa hkamja lam jaw ai.","Mahtai- Manga(5)"],"tc_q4":["Laika dum hpe kadai ni garum madi shadaw ya ai?","Nyaung mare kaw myihprap wan lu jaw na matu shata gade hkyen lajang kau ra ai kun?","Hkachyup jak gade shakap da ai?","Hkamja lam tsi gawk hpaw na matu kadai ni garum madi shadaw ya ai?","Ko Myin Zaw kaw ma gade nga ai?"],"tc_a4":["Mahtai-  UNICEF hte buga masha ni.","Mahtai- shata manga","Mahtai- 2","Mahtai-  UNICEF hte buga masha ni","Mahtai- 2"],"sd_add":[null,null,null,null,null],"sd_add_ans":[null,null,null,null,null],"dd_add":[null,null,null,null,null],"dd_add_ans":[null,null,null,null,null],"sd_sub":[null,null,null,null,null],"sd_sub_ans":[null,null,null,null,null],"dd_sub":[null,null,null,null,null],"dd_sub_ans":[null,null,null,null,null],"sd_mul":[null,null,null,null,null],"sd_mul_ans":[null,null,null,null,null],"dd_mul":[null,null,null,null,null],"dd_mul_ans":[null,null,null,null,null],"sd_div":[null,null,null,null,null],"sd_div_ans":[null,null,null,null,null],"dd_div":[null,null,null,null,null],"dd_div_ans":[null,null,null,null,null],"g5I1_passage":["Dai laika daw hpe hti u:\nGawla uk (Giraffe) ni gaw mungkan hta galu dik htum ai dusat re. Shi a n-gup galu ai majaw, hpun galu ni a namlaw namlap ni de dep hkra karum ya ai. Gawla Uk (Giraffe) ni gaw Africa kaw nga nna hpunlaw hpunlap ni hpe sha ma ai.","Dai laika daw hpe hti u:\nWhale ni gaw panglai kata na kaba dik htum dusat
